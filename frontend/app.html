<script>
/* =========================
   ACTION NOTIFICATIONS
========================== */
var DC_ACTION_WAIT_NOTE = "Actions may take up to 60 seconds to complete.";

function dcWithActionWaitNote(message) {
  var text = String(message || "");
  if (text.indexOf(DC_ACTION_WAIT_NOTE) !== -1) return text;
  return text + "\n\n" + DC_ACTION_WAIT_NOTE;
}

function dcActionAlert(message) {
  alert(dcWithActionWaitNote(message));
}

function dcActionConfirm(message) {
  return confirm(dcWithActionWaitNote(message));
}

    var lo = document.getElementById("lo_buyers");

/* =========================
   DATE HELPERS
   ========================== */
function toLocalISODate(d) {
  var tz = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - tz).toISOString().slice(0, 10);
}

function setTodayLocal(inputId) {
  var el = document.getElementById(inputId);
  if (!el) return;
  el.value = toLocalISODate(new Date());
}

/* =========================
   PARSERS / FORMATTERS
   ========================== */
function parseMoney(v) {
  if (v === null || v === undefined) return 0;
  var n = String(v).replace(/[^0-9.]/g, "");
  var f = parseFloat(n);
  return isNaN(f) ? 0 : f;
}

function parsePercent(v) {
  if (v === null || v === undefined) return 0;
  var n = String(v).replace(/[^0-9.]/g, "");
  var f = parseFloat(n);
  return isNaN(f) ? 0 : f;
}

function formatCurrencyClient(n) {
  try {
    return "$" + Number(n || 0).toLocaleString("en-US", {
      maximumFractionDigits: 2,
      minimumFractionDigits: 2
    });
  } catch (e) {
    return "$0.00";
  }
}

function formatPercentClient(n) {
  var x = Number(n || 0);
  return x.toFixed(2);
}

function formatCurrencyInput(input) {
  if (!input) return;
  var n = parseMoney(input.value);
  if (n === 0 && String(input.value).trim() === "") return;
  input.value = formatCurrencyClient(n);
}

function calculateLeaseTotalToSeller() {
  var monthlyLease = parseMoney(document.getElementById('lo_monthlyLeasePayment').value);
  var years = parseFloat(document.getElementById('lo_lengthOfOptionYears').value) || 0;
  var paymentToAgent = parseMoney(document.getElementById('lo_paymentToAgent').value);
  var total = (monthlyLease * 12 * years) + paymentToAgent;
  var totalInput = document.getElementById('lo_totalToSeller');
  totalInput.value = formatCurrencyClient(total);
  formatCurrencyInput(totalInput);
}

function formatPercentInput(input) {
  if (!input) return;
  var n = parsePercent(input.value);
  if (n === 0 && String(input.value).trim() === "") return;
  input.value = formatPercentClient(n);
}

function formatPercentInputWithSymbol(input) {
  if (!input) return;
  var n = parsePercent(input.value);
  if (n === 0 && String(input.value).trim() === "") return;
  input.value = formatPercentClient(n) + "%";
}

/* =========================
   SUBTO OPTIONAL CLOSING COSTS CALC
   ========================== */
function calculateSubToClosingCosts() {
  var loanEl = document.getElementById("sub_loanBalance");
  var closeEl = document.getElementById("sub_closingCosts");
  if (!loanEl || !closeEl) return;

  var loan = parseMoney(loanEl.value);
  if (loan <= 0) {
    dcActionAlert("Enter Loan Balance first.");
    return;
  }

  closeEl.value = formatCurrencyClient(loan * 0.03);
}

/* =========================
   SELLER FINANCE UI CALCS
   ========================== */
function calculateSellerFinance() {
  var offerEl = document.getElementById("sf_offerPrice");
  var downEl = document.getElementById("sf_downPayment");
  var pctEl = document.getElementById("sf_downPaymentPercent");
  var sfEl = document.getElementById("sf_sellerFinancingAmount");
  if (!offerEl || !downEl || !pctEl || !sfEl) return;

  var offer = parseMoney(offerEl.value);
  var down = parseMoney(downEl.value);
  var pct = parsePercent(pctEl.value);

  if (offer > 0 && pct > 0) {
    down = offer * (pct / 100);
    downEl.value = formatCurrencyClient(down);
  }

  if (offer > 0 && down > 0 && (!pctEl.value || parsePercent(pctEl.value) === 0)) {
    pct = (down / offer) * 100;
    pctEl.value = formatPercentClient(pct);
  }

  var sfAmt = Math.max(0, offer - down);
  sfEl.value = formatCurrencyClient(sfAmt);
}

function amortizeSellerFinance_() {
  var offer = parseMoney((document.getElementById("sf_offerPrice") || {}).value);
  var down = parseMoney((document.getElementById("sf_downPayment") || {}).value);

  var sfAmtEl = document.getElementById("sf_sellerFinancingAmount");
  var principal = sfAmtEl ? parseMoney(sfAmtEl.value) : Math.max(0, offer - down);
  if (principal <= 0) principal = Math.max(0, offer - down);

  var ratePct = parsePercent((document.getElementById("sf_interestRate") || {}).value);
  var loanYears = parseFloat((document.getElementById("sf_loanLengthYears") || {}).value || "0") || 0;

  var amortRaw = (document.getElementById("sf_amortizationYears") || {}).value || "";
  var amortYears = parseFloat(String(amortRaw).replace(/[^0-9.]/g, "")) || 0;

  var tiEl = document.getElementById("sf_totalInterestMade");
  var tsEl = document.getElementById("sf_totalToSeller");

  if (principal <= 0 || loanYears <= 0 || amortYears <= 0) {
    if (tiEl) tiEl.value = "";
    if (tsEl) tsEl.value = "";
    return null;
  }

  var r = (ratePct / 100);
  var i = r / 12;
  var N = Math.round(amortYears * 12);
  var k = Math.round(loanYears * 12);

  if (k <= 0) k = 1;
  if (N <= 0) N = 1;
  if (k > N) k = N;

  var pmt = (i === 0)
    ? (principal / N)
    : (principal * i / (1 - Math.pow(1 + i, -N)));

  var balanceK = (i === 0)
    ? (principal - pmt * k)
    : (principal * Math.pow(1 + i, k) - pmt * ((Math.pow(1 + i, k) - 1) / i));

  if (balanceK < 0) balanceK = 0;

  var totalPaidOverK = (pmt * k) + balanceK;
  var interestEarned = totalPaidOverK - principal;
  var totalToSeller = totalPaidOverK + down;

  if (tiEl) tiEl.value = formatCurrencyClient(interestEarned);
  if (tsEl) tsEl.value = formatCurrencyClient(totalToSeller);

  return { interestEarned: interestEarned, totalToSeller: totalToSeller };
}

function calculateAgentPayment() {
  var offerEl = document.getElementById("sf_offerPrice");
  var pctEl = document.getElementById("sf_percentToAgent");
  var payEl = document.getElementById("sf_paymentToAgent");
  if (!offerEl || !pctEl || !payEl) return;

  var offer = parseMoney(offerEl.value);
  var pct = parsePercent(pctEl.value);
  if (offer <= 0 || pct <= 0) {
    payEl.value = "";
    return;
  }

  payEl.value = formatCurrencyClient(offer * (pct / 100));
  amortizeSellerFinance_();
}

function calculateSellerFinanceClosingCosts() {
  var offerEl = document.getElementById("sf_offerPrice");
  var closeEl = document.getElementById("sf_closingCosts");
  if (!offerEl || !closeEl) return;

  var offer = parseMoney(offerEl.value);
  if (offer <= 0) {
    dcActionAlert("Enter Offer Price first.");
    return;
  }

  closeEl.value = formatCurrencyClient(offer * 0.02);
}

};

/* =========================
   FOLDER UI
   ========================== */
function getArchiveInputFor(prefix) {
  return document.getElementById(prefix + "_archiveLocation") ||
         document.getElementById(prefix + "_archiveFolder") ||
         document.getElementById(prefix + "_archiveFolderUrl");
}

function setFolderUIFor(prefix, folderUrl, archiveFolderUrl) {
  var wrap = document.getElementById(prefix + "_savedFolderWrap");
  var link = document.getElementById(prefix + "_savedFolderLink");
  var inp = document.getElementById(prefix + "_storageLocation");
  var archiveInp = getArchiveInputFor(prefix);
  var stat = document.getElementById(prefix + "_folderStatus");

  if (!wrap || !link || !inp || !stat) return;

  if (folderUrl) {
    link.href = folderUrl;
    link.textContent = folderUrl;
    wrap.classList.remove("hidden");
    inp.value = folderUrl;
  } else {
    wrap.classList.add("hidden");
    inp.value = "";
  }

  if (archiveInp) {
    archiveInp.value = archiveFolderUrl || "";
  }

  if (folderUrl && archiveFolderUrl) {
    stat.textContent = "Γ£à LOI folder and Archive folder connected.";
  } else if (folderUrl) {
    stat.textContent = "ΓÜá∩╕Å LOI folder connected. Archive folder still needs to be saved.";
  } else {
    stat.textContent = "Not set up yet. Click Authorize, then Save Folder.";
  }
}

function refreshFolderStateForType(type) {
  var prefix = getPrefixByType(type).replace("_", "");

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        setFolderUIFor(prefix, res.folderUrl || res.loiFolderUrl || "", res.archiveFolderUrl || "");
      }
    })
    .withFailureHandler(function(err) {
      var stat = document.getElementById(prefix + "_folderStatus");
      if (stat) {
        stat.textContent = "Could not load folder state.";
      }
    })
    .getSetupStateForOfferType(type);
}

function loadSetupState() {
  refreshFolderStateForType("Cash");
  refreshFolderStateForType("SellerFinance");
  refreshFolderStateForType("SubTo");
  refreshFolderStateForType("LeaseOption");
}

window.dealCannonLoadOfferSetupState = loadSetupState;

function saveFolder(prefix) {
  var inp = document.getElementById(prefix + "_storageLocation");
  var archiveInp = getArchiveInputFor(prefix);
  var stat = document.getElementById(prefix + "_folderStatus");

  if (!inp) return;

  var offerType = getTypeByPrefix(prefix);
  var folderUrl = String(inp.value || "").trim();
  var archiveFolderUrl = archiveInp
    ? String(archiveInp.value || "").trim()
    : folderUrl;

  if (!folderUrl) {
    dcActionAlert("Please paste a Google Drive LOI folder URL first.");
    return;
  }

  if (!archiveFolderUrl) {
    archiveFolderUrl = folderUrl;
  }

  if (stat) stat.textContent = "Saving folder settings…";

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        setFolderUIFor(
          prefix,
          res.folderUrl || res.loiFolderUrl || folderUrl,
          res.archiveFolderUrl || archiveFolderUrl
        );
      } else {
        if (stat) stat.textContent = "Folder save failed.";
        dcActionAlert("Folder save failed.");
      }
    })
    .withFailureHandler(function(err) {
      if (stat) stat.textContent = "Folder save failed.";
      dcActionAlert("Folder error: " + (err && err.message ? err.message : err));
    })
    .saveUserFolderForOfferType(offerType, folderUrl, archiveFolderUrl);
}

function pulseGenerateButton_(button) {
  if (!button) return;
  button.classList.remove("offer-btn-pressed");
  void button.offsetWidth;
  button.classList.add("offer-btn-pressed");
  window.setTimeout(function() {
    button.classList.remove("offer-btn-pressed");
  }, 800);
}

/* =========================
   GENERATE
========================== */
window.generate = function(type) {
  var prefix = getPrefixByType(type);
  var activeButton = (window.event && window.event.currentTarget) || document.querySelector('[data-generate-loi][data-offer-type="' + type + '"]');
  pulseGenerateButton_(activeButton);

  var get = function(id) {
    var el = document.getElementById(prefix + id);
    return el ? el.value : "";
  };

  var payload = {
    propertyAddress: get("propertyAddress"),
    date: get("date"),
    sellerName: get("sellerName"),
    buyers: get("buyers"),
    description: get("description"),
    propertyType: get("propertyType"),

    financeType: get("financeType"),
    purchasePrice: get("purchasePrice"),
    earnestMoney: get("earnestMoney"),

    offerPrice: get("offerPrice"),
    downPayment: get("downPayment"),
    downPaymentPercent: get("downPaymentPercent"),
    sellerFinancingAmount: get("sellerFinancingAmount"),
    interestRate: get("interestRate"),
    loanLengthYears: get("loanLengthYears"),
    amortizationYears: get("amortizationYears"),
    percentToAgent: get("percentToAgent"),
    paymentToAgent: get("paymentToAgent"),
    closingCosts: get("closingCosts"),

    loanBalance: get("loanBalance"),
    monthlyPayment: get("monthlyPayment"),
    paymentToSeller: get("paymentToSeller"),

    marketingCompany: get("marketingCompany"),
    optionPurchasePrice: get("optionPurchasePrice"),
    lengthOfOptionYears: get("lengthOfOptionYears"),
    monthlyLeasePayment: get("monthlyLeasePayment"),
    totalToSeller: get("totalToSeller"),

    recipientEmail: get("recipientEmail"),
    storageLocation: get("storageLocation")
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        if (type === "SellerFinance" && res.data) {
          var ti = document.getElementById("sf_totalInterestMade");
          var ts = document.getElementById("sf_totalToSeller");
          if (ti && res.data.totalInterestMade) ti.value = res.data.totalInterestMade;
          if (ts && res.data.totalToSeller) ts.value = res.data.totalToSeller;
        }
        dcActionAlert("LOI generated and Gmail draft created.");
      } else {
        dcActionAlert("Server error: " + (res ? (res.error || "Unknown error") : "Unknown error"));
      }
    })
    .withFailureHandler(function(err) {
      dcActionAlert("Server failure: " + (err && err.message ? err.message : err));
    })
    .generate(type, payload);
};

function escapeTemplatePreviewHtml_(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function setTemplatePreviewBody_(value) {
  var el = document.getElementById("template_preview_body");
  if (!el) return;

  if (el.tagName && (el.tagName.toLowerCase() === "textarea" || el.tagName.toLowerCase() === "input")) {
    el.value = String(value || "");
    return;
  }

  var safeHtml = escapeTemplatePreviewHtml_(value).replace(/\r?\n/g, "<br>");
  el.innerHTML = safeHtml;
}

/**
 * Dynamically builds token buttons under the #template_tokens_container element.
 */
function renderAvailableTemplateTokens_(tokens) {
  var container = document.getElementById("template_tokens_container");
  if (!container) return;
  container.innerHTML = "";

  if (!tokens || tokens.length === 0) {
    container.innerHTML = '<span class="help-text" style="color: var(--text-muted); font-size: 13px;">No tokens loaded.</span>';
    return;
  }

  tokens.forEach(function(token) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "offer-btn";
    btn.style.margin = "2px";
    btn.textContent = token;
    btn.onclick = function() {
      insertTemplateToken(token);
    };
    container.appendChild(btn);
  });
}

function switchInitialOutreachTemplateType_() {
  var select = document.getElementById("initial_outreach_type");
  if (!select) return;
  
  var prevType = window.activeInitialOutreachType || "InitialOutreach_SubTo";
  var newType = select.value;
  
  // Save current input values into memory
  if (!window.templatesInMemory[prevType]) {
    window.templatesInMemory[prevType] = {};
  }
  window.templatesInMemory[prevType].subject = getTemplateFieldValue_("template_initial_subject");
  window.templatesInMemory[prevType].body = getTemplateFieldValue_("template_initial_body");
  
  // Load the new template data from memory
  var currentTemplate = window.templatesInMemory[newType] || { subject: "", body: "" };
  setTemplateFieldValue_("template_initial_subject", currentTemplate.subject || "");
  setTemplateFieldValue_("template_initial_body", currentTemplate.body || "");
  
  // Update active type tracking variable
  window.activeInitialOutreachType = newType;
  
  // Update live preview
  updateTemplatePreview();
}

window.loadEmailTemplates = function(options) {
  options = options || {};

  if (!document.getElementById("template_initial_subject")) return;

  if (window.templatesLoading) {
    return;
  }

  if (window.templatesLoaded && !options.forceRefresh) {
    updateTemplatePreview();
    return;
  }

  window.templatesLoading = true;

  google.script.run
    .withSuccessHandler(function(res) {
      window.templatesLoading = false;

      if (!res || res.success === false) {
        var errMsg = res ? res.message : "Unknown templates load error.";
        alert("Could not load email templates: " + errMsg);
        return;
      }

      var templates = res.templates || {};
      window.templatesInMemory = templates;
      var availableTokens = res.availableTokens || [];

      // Fallback to legacy InitialOutreach if specific templates are missing/blank
      if (templates.InitialOutreach) {
        if (!templates.InitialOutreach_SubTo || !templates.InitialOutreach_SubTo.body) {
          templates.InitialOutreach_SubTo = {
            subject: templates.InitialOutreach.subject,
            body: templates.InitialOutreach.body
          };
        }
        if (!templates.InitialOutreach_SellerFinance || !templates.InitialOutreach_SellerFinance.body) {
          templates.InitialOutreach_SellerFinance = {
            subject: templates.InitialOutreach.subject,
            body: templates.InitialOutreach.body
          };
        }
        if (!templates.InitialOutreach_LeaseOption || !templates.InitialOutreach_LeaseOption.body) {
          templates.InitialOutreach_LeaseOption = {
            subject: templates.InitialOutreach.subject,
            body: templates.InitialOutreach.body
          };
        }
      }

      // Set active tracking key based on dropdown's current selection
      var select = document.getElementById("initial_outreach_type");
      var activeKey = select ? select.value : "InitialOutreach_SubTo";
      window.activeInitialOutreachType = activeKey;

      var outreachTemplate = templates[activeKey] || {};
      setTemplateFieldValue_("template_initial_subject", outreachTemplate.subject || "");
      setTemplateFieldValue_("template_initial_body", outreachTemplate.body || "");

      if (templates.Cash) {
        setTemplateFieldValue_("template_cash_subject", templates.Cash.subject || "");
        setTemplateFieldValue_("template_cash_body", templates.Cash.body || "");
      }

      if (templates.SellerFinance) {
        setTemplateFieldValue_("template_sf_subject", templates.SellerFinance.subject || "");
        setTemplateFieldValue_("template_sf_body", templates.SellerFinance.body || "");
      }

      if (templates.SubTo) {
        setTemplateFieldValue_("template_sub_subject", templates.SubTo.subject || "");
        setTemplateFieldValue_("template_sub_body", templates.SubTo.body || "");
      }

      if (templates.LeaseOption) {
        setTemplateFieldValue_("template_lo_subject", templates.LeaseOption.subject || "");
        setTemplateFieldValue_("template_lo_body", templates.LeaseOption.body || "");
      }

      // Populate LOI template custom Google Doc URLs defensively
      var loiTemplates = res.loiTemplates || {};
      
      function bindLoiLink_(linkId, url) {
        var link = document.getElementById(linkId);
        if (!link) return;
        if (url && url.trim() !== "") {
          link.href = url;
          link.innerText = "Open in Google Docs";
          link.classList.remove("offer-btn-disabled");
          link.style.display = "inline-block";
          link.style.pointerEvents = "auto";
          link.style.opacity = "1";
        } else {
          link.href = "#";
          link.innerText = "Template not connected yet";
          link.style.display = "inline-block";
          link.style.pointerEvents = "none";
          link.style.opacity = "0.6";
        }
      }

      bindLoiLink_("loi_cash_link", loiTemplates.Cash || loiTemplates.LOI_Cash);
      bindLoiLink_("loi_sf_link", loiTemplates.SellerFinance || loiTemplates.LOI_SellerFinance);
      bindLoiLink_("loi_sub_link", loiTemplates.SubTo || loiTemplates.LOI_SubTo);
      bindLoiLink_("loi_lease_link", loiTemplates.LeaseOption || loiTemplates.LOI_LeaseOption);

      window.templatesLoaded = true;
      renderAvailableTemplateTokens_(availableTokens);
      loadTemplatePreviewOutreachInfo_();
      updateTemplatePreview();
    })
    .withFailureHandler(function(err) {
      window.templatesLoading = false;
      var errMsg = err && err.message ? err.message : String(err);
      alert("Could not load email templates: " + errMsg);
    })
    .getEmailTemplates();
};

function syncActiveInitialOutreachTemplate_() {
  var activeType = window.activeInitialOutreachType || "InitialOutreach_SubTo";
  if (!window.templatesInMemory[activeType]) {
    window.templatesInMemory[activeType] = {};
  }
  window.templatesInMemory[activeType].subject = getTemplateFieldValue_("template_initial_subject");
  window.templatesInMemory[activeType].body = getTemplateFieldValue_("template_initial_body");
}

function runEmailTemplateSave_(templatesPayload, successMessage) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || res.success === false) {
        var errMsg = res ? res.message : "Unknown template save error.";
        alert("Could not save email templates: " + errMsg);
        return;
      }

      window.templatesInMemory = res.templates || {};

      if (res.availableTokens) {
        renderAvailableTemplateTokens_(res.availableTokens);
      }

      updateTemplatePreview();
      alert(successMessage || "Email template saved successfully.");
    })
    .withFailureHandler(function(err) {
      var errMsg = err && err.message ? err.message : String(err);
      alert("Could not save email templates: " + errMsg);
    })
    .saveEmailTemplates({ templates: templatesPayload });
}

window.insertTemplateToken = function(token) {
  var target = window.lastTemplateFieldFocused;
  var fieldIds = getTemplateFieldIds_();

  if (!target || fieldIds.indexOf(target.id) === -1) {
    var map = getTemplateFieldMap_();
    var type = getCurrentPreviewTemplateType_();
    target = document.getElementById((map[type] || map.InitialOutreach).body);
  }

  if (!target) return;

  var value = target.value || "";
  var start = typeof target.selectionStart === "number" ? target.selectionStart : value.length;
  var end = typeof target.selectionEnd === "number" ? target.selectionEnd : value.length;

  target.value = value.slice(0, start) + token + value.slice(end);
  target.focus();

  if (target.setSelectionRange) {
    var cursor = start + String(token || "").length;
    target.setSelectionRange(cursor, cursor);
  }

  window.lastTemplateFieldFocused = target;
  updateTemplatePreview();
};

window._templatePreviewDebounceTimer = null;
window.updateTemplatePreview = function() {
  if (window._templatePreviewDebounceTimer) clearTimeout(window._templatePreviewDebounceTimer);
  window._templatePreviewDebounceTimer = setTimeout(function() {
    var type = getCurrentPreviewTemplateType_();
    var map = getTemplateFieldMap_();
    var ids = map[type] || map.InitialOutreach;
    var subject = renderTemplatePreviewText_(getTemplateFieldValue_(ids.subject), type);
    var body = renderTemplatePreviewText_(getTemplateFieldValue_(ids.body), type);
    var subjectEl = document.getElementById("template_preview_subject");
    if (subjectEl) subjectEl.value = subject;
    setTemplatePreviewBody_(body);
  }, 200);
};

function initEmailTemplateUi_() {
  if (window.templateUiInitialized) {
    return;
  }

  var fieldIds = getTemplateFieldIds_();
  var hasTemplateUi = false;

  fieldIds.forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;

    hasTemplateUi = true;

    el.addEventListener("focus", function() {
      window.lastTemplateFieldFocused = this;
    });

    el.addEventListener("input", updateTemplatePreview);
  });

  var outreachSelect = document.getElementById("initial_outreach_type");
  if (outreachSelect) {
    hasTemplateUi = true;
    outreachSelect.addEventListener("change", function() {
      switchInitialOutreachTemplateType_();
    });
  }

  var previewType = document.getElementById("template_preview_type");
  if (previewType) {
    hasTemplateUi = true;
    previewType.addEventListener("change", updateTemplatePreview);
  }

  if (hasTemplateUi) {
    window.templateUiInitialized = true;
    loadEmailTemplates();
  }
}

window.initializeTemplatesView = function() {
