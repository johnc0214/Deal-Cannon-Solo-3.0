<style>

  --da-panel-3: #1a2942;

#analyzerMount .da-step-header {

}

#analyzerMount .da-image-grid {

  margin-top: 14px;
}

}

}

#analyzerMount .da-gradient {

}

}

#analyzerMount .da-card-inner { padding: 22px; }

#analyzerMount .da-section-title {

}

#analyzerMount .da-card-title-row {

  align-items: center;
  justify-content: space-between;

  margin-bottom: 14px;
}

#analyzerMount .da-muted { color: var(--da-muted); }

#analyzerMount .da-badge {

#analyzerMount .da-grid-2,
#analyzerMount .da-grid-3,

#analyzerMount .da-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#analyzerMount .da-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

#analyzerMount .da-stack { display: grid; gap: 16px; }

#analyzerMount .da-section-spacer { margin-top: 24px; }

#analyzerMount .da-section-divider {

#analyzerMount .da-label {

}

#analyzerMount .da-input,
#analyzerMount .da-select,

}

#analyzerMount .da-input-readonly {

  border-color: rgba(74, 222, 128, 0.28);
  color: #d8ffe5;
}

#analyzerMount .da-input-highlight {
  background: rgba(255, 245, 157, 0.16);
  border-color: rgba(168, 85, 247, 0.45);
  box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.10);
}

#analyzerMount .da-input-calculated {
  background: rgba(45, 212, 191, 0.12);
  border-color: rgba(45, 212, 191, 0.42);

#analyzerMount .da-help {

}

#analyzerMount .da-note,
#analyzerMount .da-warning,
#analyzerMount .da-error,
#analyzerMount .da-success {

  padding: 14px 16px;
  border: 1px solid transparent;
  font-size: 0.92rem;
}

#analyzerMount .da-note {
  background: rgba(76, 141, 255, 0.08);
  border-color: rgba(76, 141, 255, 0.22);
  color: #cbd8ff;
}

#analyzerMount .da-warning {
  background: rgba(251, 191, 36, 0.09);
  border-color: rgba(251, 191, 36, 0.24);
  color: #f8df97;
}

#analyzerMount .da-error {
  background: rgba(248, 113, 113, 0.09);
  border-color: rgba(248, 113, 113, 0.24);
  color: #ffc6c6;
}

#analyzerMount .da-success {

  border-color: rgba(45, 212, 191, 0.24);

#analyzerMount .da-btn {

  font-weight: 700;

}

#analyzerMount .da-btn:hover { transform: translateY(-1px); }

#analyzerMount .da-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

#analyzerMount .da-btn-primary {
  background: linear-gradient(135deg, var(--da-blue), var(--da-purple));
}

#analyzerMount .da-btn-secondary {
  background: linear-gradient(135deg, #314059, #4b5f82);
}

#analyzerMount .da-btn-cyan {
  background: linear-gradient(135deg, #27a7ff, #0fd5ff);
}

#analyzerMount .da-btn-green {
  background: linear-gradient(135deg, #22c55e, #16a34a);
}

#analyzerMount .da-btn-yellow {
  background: linear-gradient(135deg, #f59e0b, #facc15);
  color: #111827;
}

  padding: 18px;

  background: rgba(6, 12, 24, 0.72);
}

  font-weight: 800;
  color: #eaf1ff;

}

}

}

}

  width: 48px;
  height: 48px;
  border-color: rgba(23, 199, 255, 0.3);
  animation: da-orbit-spin-reverse 3.5s linear infinite;
}

#analyzerMount .da-cook-dot {

  height: 10px;
  background: linear-gradient(135deg, #9ad8ff, #a46bff);
  box-shadow: 0 0 14px rgba(116, 165, 255, 0.45);
}

#analyzerMount .da-cook-dot-a {
  transform: translate(0, -28px);
  animation: da-dot-float-a 1.8s ease-in-out infinite;
}

#analyzerMount .da-cook-dot-b {
  transform: translate(22px, 12px);
  animation: da-dot-float-b 1.8s ease-in-out infinite;
}

#analyzerMount .da-cook-dot-c {
  transform: translate(-24px, 16px);
  animation: da-dot-float-c 1.8s ease-in-out infinite;
}

#analyzerMount .da-toggle-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

#analyzerMount .da-toggle {
  border: 1px solid #30425e;
  background: rgba(20, 28, 48, 0.95);
  color: #cdd9f4;
  border-radius: 12px;
  padding: 10px 12px;
  cursor: pointer;
  font-weight: 600;
}

#analyzerMount .da-toggle-active {
  background: linear-gradient(135deg, #2e6fff, #7c43ff);
  color: white;
  border-color: transparent;
}

#analyzerMount .da-upload {

  border-radius: 18px;
  padding: 24px;
  text-align: center;
  background: rgba(8, 15, 29, 0.75);

}

#analyzerMount .da-upload.is-dragover {
  border-color: #62a6ff;
  background: rgba(15, 28, 52, 0.9);

}

#analyzerMount .da-upload-icon {

  height: 58px;

  place-items: center;

}

#analyzerMount .da-upload input[type="file"] { display: none; }
#analyzerMount .da-upload-label { display: inline-flex; margin-top: 14px; }

#analyzerMount .da-upload-actions {
  justify-content: center;
}

#analyzerMount .da-step-list {
  margin: 16px 0 0;
  padding-left: 18px;
  text-align: left;
  color: #d9e5ff;
  line-height: 1.6;
}

#analyzerMount .da-step-list li + li {

}

#analyzerMount .da-output {

  padding: 18px;
}

#analyzerMount .da-output-short { min-height: 160px; }

#analyzerMount .da-pre {

  word-break: break-word;
  font-family: inherit;
  line-height: 1.55;
  color: #dce7ff;
}

#analyzerMount .da-table {
  width: 100%;

  overflow: hidden;
  border-radius: 18px;
}

#analyzerMount .da-table th,
#analyzerMount .da-table td {
  padding: 12px 14px;
  border: 1px solid var(--da-border);

}

#analyzerMount .da-table th {

  background: rgba(34, 49, 78, 0.9);
}

#analyzerMount .da-table td:last-child,

#analyzerMount .da-table-highlight { background: rgba(76, 141, 255, 0.08); }

#analyzerMount .da-table-total {
  background: rgba(45, 212, 191, 0.08);
  font-weight: 700;
}

#analyzerMount .da-kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

#analyzerMount .da-kpi {
  padding: 18px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(76, 141, 255, 0.18), rgba(141, 85, 255, 0.18));
  border: 1px solid rgba(120, 155, 255, 0.2);
}

#analyzerMount .da-kpi p { margin: 0; }

#analyzerMount .da-kpi-label {
  color: #cbd6f2;
  font-size: 0.88rem;
}

#analyzerMount .da-kpi-value {
  font-size: 1.8rem;
  font-weight: 800;
  margin-top: 10px;
}

#analyzerMount .da-kpi-value-compact {
  font-size: 1.45rem;
  line-height: 1.2;
  word-break: break-word;
}

#analyzerMount .da-kpi-grid-mortgage {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

#analyzerMount .da-kpi-grid-mortgage .da-kpi {
  padding: 16px;
}

#analyzerMount .da-kpi-grid-mortgage .da-kpi-label {
  font-size: 0.82rem;
  line-height: 1.2;
}

#analyzerMount .da-kpi-grid-mortgage .da-kpi-value {
  font-size: 1.25rem;
  line-height: 1.15;
  margin-top: 8px;
}

#analyzerMount .da-kpi-grid-mortgage .da-kpi-value-compact {
  font-size: 1.25rem;
}

#analyzerMount .da-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(110, 140, 197, 0.45), transparent);
  margin: 16px 0;
}

#analyzerMount .da-summary-list { display: grid; gap: 10px; }

#analyzerMount .da-summary-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(110, 140, 197, 0.15);
}

#analyzerMount .da-summary-row span:last-child {
  text-align: right;
  font-weight: 700;
}

#analyzerMount .da-result-actions {

  justify-content: space-between;

  margin-bottom: 18px;
}

#analyzerMount .da-spinner {

  border: 3px solid rgba(255, 255, 255, 0.18);
  border-top-color: #8ab6ff;
  border-radius: 50%;
  animation: da-spin 0.9s linear infinite;
}

@keyframes da-spin {
  to { transform: rotate(360deg); }
}

@keyframes da-core-pulse {
  0%, 100% { transform: scale(0.96); }
  50% { transform: scale(1.08); }
}

@keyframes da-orbit-spin {
  to { transform: rotate(360deg); }
}

@keyframes da-orbit-spin-reverse {
  to { transform: rotate(-360deg); }
}

@keyframes da-dot-float-a {
  0%, 100% { transform: translate(0, -28px) scale(0.95); }
  50% { transform: translate(6px, -22px) scale(1.1); }
}

@keyframes da-dot-float-b {
  0%, 100% { transform: translate(22px, 12px) scale(0.95); }
  50% { transform: translate(16px, 4px) scale(1.1); }
}

@keyframes da-dot-float-c {
  0%, 100% { transform: translate(-24px, 16px) scale(0.95); }
  50% { transform: translate(-18px, 6px) scale(1.08); }
}

}

}

#analyzerMount .da-chat-wrap {
  margin-top: 18px;
}

  overflow-y: auto;
  padding-right: 6px;
}

#analyzerMount .da-chat-message {

}

#analyzerMount .da-chat-message-user {

}

#analyzerMount .da-chat-message-assistant {

}

#analyzerMount .da-chat-role {

}

#analyzerMount .da-chat-text {

}

#analyzerMount .da-chat-empty {

}

#analyzerMount .da-chat-input {

}

#analyzerMount .da-mortgage-card {

}

#analyzerMount .da-mortgage-card .da-card-title,
#analyzerMount .da-mortgage-card .da-section-title,

}

#analyzerMount .da-mortgage-card .da-badge {

}

#analyzerMount .da-mortgage-card .da-input,
#analyzerMount .da-mortgage-card .da-select,
#analyzerMount .da-mortgage-card .da-textarea {

#analyzerMount .da-mortgage-card .da-input:focus,
#analyzerMount .da-mortgage-card .da-select:focus,
#analyzerMount .da-mortgage-card .da-textarea:focus {

#analyzerMount .da-mortgage-card .da-kpi {

#analyzerMount .da-mortgage-card .da-note {

  border-color: rgba(141, 85, 255, 0.18);
}

#analyzerMount .da-mortgage-card .da-table th {
  background: rgba(141, 85, 255, 0.14);
  color: #4b1d7a;
}

#analyzerMount .da-mortgage-card .da-table td {

  align-items: center;
