  function parseNumber(value) {
    var cleaned = String(value == null ? '' : value).replace(/[^0-9.-]/g, '');
    var parsed = parseFloat(cleaned);
    return isNaN(parsed) ? 0 : parsed;
  }

  function formatCurrency(value, digits) {
    var amount = Number(value || 0);
    return new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'USD',
      minimumFractionDigits: typeof digits === 'number' ? digits : 2,
      maximumFractionDigits: typeof digits === 'number' ? digits : 2
    }).format(amount);
  }

  function formatPercent(value) {
    return Number(value || 0).toFixed(2) + '%';
  }

  function formatCurrencyRange(low, high) {
    var normalizedLow = Number(low || 0);
    var normalizedHigh = Number(high || 0);

    if (normalizedLow > 0 && normalizedHigh > 0) {
      if (normalizedHigh < normalizedLow) {
        var swap = normalizedLow;
        normalizedLow = normalizedHigh;
        normalizedHigh = swap;
      }
      if (normalizedLow === normalizedHigh) {
        return formatCurrency(normalizedLow, 0);
      }
      return formatCurrency(normalizedLow, 0) + ' - ' + formatCurrency(normalizedHigh, 0);
    }

    if (normalizedHigh > 0) return formatCurrency(normalizedHigh, 0);
    return formatCurrency(normalizedLow, 0);
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatCOC(value) {
    if (value === Infinity) return 'Infinite';
    if (isNaN(value)) return 'N/A';
    return Number(value).toFixed(2) + '%';
  }

  function readFileAsText(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || '')); };
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  function readFileAsBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = String(reader.result || '');
        var parts = result.split(',');
        resolve({ data: parts[1] || '', mimeType: file.type || 'image/jpeg', name: file.name });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function isImageFile_(file) {
    if (!file) {
      return false;
    }

    var mimeType = String(file.type || '').toLowerCase();
    if (mimeType.indexOf('image/') === 0) {
      return true;
    }

    return /\.(avif|bmp|gif|heic|heif|jpe?g|png|svg|webp)$/i.test(String(file.name || ''));
  }

  function normalizeRehabImageFiles_(files) {
    var list = Array.prototype.slice.call(files || []);
    var acceptedFiles = [];
    var skippedCount = 0;

    list.forEach(function (file) {
      if (isImageFile_(file)) {
        acceptedFiles.push(file);
      } else {
        skippedCount++;
      }
    });

    return {
      acceptedFiles: acceptedFiles,
      skippedCount: skippedCount,
      totalCount: list.length
    };
  }

  function calculateFixAndFlipResults(formData) {
    var fundingMethod = 'Maximum Allowable Offer (MAO) Calculator';
    var repairs = parseNumber(formData.estimatedRepairCost);
    var downPaymentPercentage = parseNumber(formData.downPaymentPercentage);
    var hmInterestRate = parseNumber(formData.hardMoneyInterestRate);
    var hmAmortization = Math.max(parseNumber(formData.hardMoneyAmortization), 1);
    var holdingMonths = Math.max(parseNumber(formData.holdingMonths), 1);
    var pmlInterestRate = parseNumber(formData.pmlInterestRate);
    var arv = parseNumber(formData.arv);
    var wholesaleFee = parseNumber(formData.wholesaleFee);
    var desiredProfitMargin = 0.20;
    var enteredPurchasePrice = parseNumber(formData.purchasePrice);
    var askingPrice = enteredPurchasePrice;
    var flippersPrice = Math.max((arv * 0.75) - repairs, 0);
    var pricePlusRepairs = flippersPrice + repairs;
    var closingCosts = arv * 0.03;
    var realtorFeesPercent = 6;
    var realtorFees = arv * (realtorFeesPercent / 100);

    var hardMoneyDownPayment = pricePlusRepairs * (downPaymentPercentage / 100);
    var hardMoneyLoanAmount = pricePlusRepairs - hardMoneyDownPayment;
    var hardMoneyMonthlyRate = (hmInterestRate / 100) / 12;
    var hardMoneyNumberOfPayments = hmAmortization * 12;
    var hardMoneyMonthlyPayment = 0;

    if (hardMoneyMonthlyRate > 0) {
      hardMoneyMonthlyPayment = hardMoneyLoanAmount * (hardMoneyMonthlyRate * Math.pow(1 + hardMoneyMonthlyRate, hardMoneyNumberOfPayments)) / (Math.pow(1 + hardMoneyMonthlyRate, hardMoneyNumberOfPayments) - 1);
    } else {
      hardMoneyMonthlyPayment = hardMoneyLoanAmount / hardMoneyNumberOfPayments;
    }

    var totalHardMoneyPayments = hardMoneyMonthlyPayment * holdingMonths;
    var hardMoneyPmlAmount = hardMoneyDownPayment;
    var hardMoneyPmlMonthlyPayment = (hardMoneyPmlAmount * (pmlInterestRate / 100)) / 12;
    var hardMoneyTotalPmlInterest = hardMoneyPmlMonthlyPayment * holdingMonths;
    var hardMoneyTotalPmlPayWhenFlipSells = hardMoneyPmlAmount + hardMoneyTotalPmlInterest;
    var hardMoneyTotalCostsToFlip = flippersPrice + repairs + totalHardMoneyPayments + hardMoneyTotalPmlInterest + closingCosts + realtorFees;
    var hardMoneyActualProfit = arv - hardMoneyTotalCostsToFlip;
    var hardMoneyActualProfitPercent = hardMoneyTotalCostsToFlip > 0 ? (hardMoneyActualProfit / hardMoneyTotalCostsToFlip) * 100 : 0;

    var desiredProfitAmount = hardMoneyTotalCostsToFlip * desiredProfitMargin;
    var differenceBetweenActualAndDesiredProfit = hardMoneyActualProfit - desiredProfitAmount;
    var totalFixedCosts = repairs + totalHardMoneyPayments + closingCosts + realtorFees;
    var maximumPurchasePriceFormula = (arv - totalFixedCosts) / (1 + desiredProfitMargin);
    var flippersMaximumPrice = flippersPrice + differenceBetweenActualAndDesiredProfit;
    var maxWholesalePrice = flippersMaximumPrice - wholesaleFee;

    var straightPmlPrincipal = pricePlusRepairs;
    var straightPmlMonthlyPayment = (straightPmlPrincipal * (pmlInterestRate / 100)) / 12;
    var straightPmlTotalInterest = straightPmlMonthlyPayment * holdingMonths;
    var straightPmlLoanPaymentAtRate = straightPmlPrincipal * (pmlInterestRate / 100);
    var straightPmlDifferenceOwedAtSale = straightPmlLoanPaymentAtRate - straightPmlTotalInterest;
    var straightPmlTotalCostsToFlip = flippersPrice + repairs + straightPmlLoanPaymentAtRate + closingCosts + realtorFees;
    var straightPmlActualProfit = arv - straightPmlTotalCostsToFlip;
    var straightPmlActualProfitPercent = straightPmlTotalCostsToFlip > 0 ? (straightPmlActualProfit / straightPmlTotalCostsToFlip) * 100 : 0;

    var presentValue = arv - repairs;
    var averageFee = arv * 0.02;
    var lowestFirstOffer = flippersPrice - wholesaleFee;

    return {
      fundingMethod: fundingMethod,
      isMaoMode: true,
      askingPrice: askingPrice,
      purchasePrice: flippersPrice,
      flippersPrice: flippersPrice,
      repairs: repairs,
      presentValue: presentValue,
      averageFee: averageFee,
      lowestFirstOffer: lowestFirstOffer,
      pricePlusRepairs: pricePlusRepairs,
      downPaymentPercentage: downPaymentPercentage,
      downPaymentOnHardMoney: hardMoneyDownPayment,
      totalLoanAmount: hardMoneyLoanAmount,
      hmInterestRate: hmInterestRate,
      hmAmortization: hmAmortization,
      holdingMonthlyPayment: hardMoneyMonthlyPayment,
      holdingMonths: holdingMonths,
      totalHardMoneyPayments: totalHardMoneyPayments,
      pmlAmount: hardMoneyPmlAmount,
      pmlInterestRate: pmlInterestRate,
      pmlMonthlyPayment: hardMoneyPmlMonthlyPayment,
      totalPmlInterest: hardMoneyTotalPmlInterest,
      totalPmlPayWhenFlipSells: hardMoneyTotalPmlPayWhenFlipSells,
      closingCosts: closingCosts,
      closingCostsPercent: 3,
      realtorFees: realtorFees,
      realtorFeesPercent: realtorFeesPercent,
      wholesaleFee: wholesaleFee,
      totalFixedCosts: totalFixedCosts,
      desiredProfitMarginPercent: desiredProfitMargin * 100,
      desiredProfitAmount: desiredProfitAmount,
      differenceBetweenActualAndDesiredProfit: differenceBetweenActualAndDesiredProfit,
      maximumPurchasePriceFormula: maximumPurchasePriceFormula,
      flippersMaximumPrice: flippersMaximumPrice,
      maxWholesalePrice: maxWholesalePrice,
      totalCostsToFlip: hardMoneyTotalCostsToFlip,
      arv: arv,
      actualProfit: hardMoneyActualProfit,
      actualProfitPercent: hardMoneyActualProfitPercent,
      hardMoneyScenario: {
        flippersPrice: flippersPrice,
        repairs: repairs,
        pricePlusRepairs: pricePlusRepairs,
        downPaymentPercentage: downPaymentPercentage,
        downPaymentOnHardMoney: hardMoneyDownPayment,
        totalLoanAmount: hardMoneyLoanAmount,
        hardMoneyInterestRate: hmInterestRate,
        amortization: hmAmortization,
        holdingMonthlyPayment: hardMoneyMonthlyPayment,
        holdingMonths: holdingMonths,
        totalHardMoneyPayments: totalHardMoneyPayments,
        pmlAmount: hardMoneyPmlAmount,
        annualInterestRate: pmlInterestRate,
        pmlMonthlyPayment: hardMoneyPmlMonthlyPayment,
        totalInterestOverHoldingMonths: hardMoneyTotalPmlInterest,
        totalPmlPayWhenFlipSells: hardMoneyTotalPmlPayWhenFlipSells,
        closingCosts: closingCosts,
        realtorFees: realtorFees,
        totalCostsToFlip: hardMoneyTotalCostsToFlip,
        actualProfit: hardMoneyActualProfit,
        actualProfitPercent: hardMoneyActualProfitPercent
      },
      straightPmlScenario: {
        flippersPrice: flippersPrice,
        repairs: repairs,
        pricePlusRepairs: pricePlusRepairs,
        downPaymentPercentage: 0,
        downPaymentOnHardMoney: 0,
        totalLoanAmount: straightPmlPrincipal,
        pmlAmount: straightPmlPrincipal,
        holdingMonths: holdingMonths,
        annualInterestRate: pmlInterestRate,
        monthlyPayment: straightPmlMonthlyPayment,
        totalInterestOverHoldingMonths: straightPmlTotalInterest,
        differenceOwedAtSale: straightPmlDifferenceOwedAtSale,
        totalPmlLoanPaymentAtRate: straightPmlLoanPaymentAtRate,
        closingCosts: closingCosts,
        realtorFees: realtorFees,
        totalCostsToFlip: straightPmlTotalCostsToFlip,
        actualProfit: straightPmlActualProfit,
        actualProfitPercent: straightPmlActualProfitPercent
      }
    };
  }

  function calculateLeaseOptionResults(formData) {
    var monthlyPayment = parseNumber(formData.monthlyPayment);
    var leaseOptionAskingPrice = parseNumber(formData.leaseOptionAskingPrice);
    var unrefundableLeaseOptionFee = parseNumber(formData.unrefundableLeaseOptionFee);
    var averageRentRates = parseNumber(formData.averageRentRates);
    var pml = parseNumber(formData.pml);
    var propertyTaxesPerMonth = parseNumber(formData.propertyTaxesPerMonth);
    var leaseTermInMonths = parseNumber(formData.leaseTermInMonths);
    var mortgageBalance = parseNumber(formData['mortgage-balance']);
    var downPayment = parseNumber(formData.leaseOptionDownPayment);
    var closingCosts = parseNumber(formData.leaseOptionClosingCosts);
    var monthlyCashFlow = averageRentRates - monthlyPayment - propertyTaxesPerMonth;
    var yearlyCashFlow = monthlyCashFlow * 12;
    var totalCashFlow = monthlyCashFlow * leaseTermInMonths;
    var downPaymentProfit = leaseOptionAskingPrice - mortgageBalance;
    var cashInvested = pml;
    var cashFlowCOC = cashInvested > 0 ? (yearlyCashFlow / cashInvested) * 100 : Infinity;
    var leaseOptionFeeCOC = cashInvested > 0 ? (unrefundableLeaseOptionFee / cashInvested) * 100 : Infinity;
    var totalProfitIfBuys = totalCashFlow + downPaymentProfit + unrefundableLeaseOptionFee;
    var totalCOCIfBuys = cashInvested > 0 ? (totalProfitIfBuys / cashInvested) * 100 : Infinity;
    var totalEntryFee = unrefundableLeaseOptionFee + downPayment + closingCosts;

    return {
      yearlyCashFlow: yearlyCashFlow,
      totalCashFlow: totalCashFlow,
      downPaymentProfit: downPaymentProfit,
      cashFlowCOC: cashFlowCOC,
      leaseOptionFeeCOC: leaseOptionFeeCOC,
      totalCOCIfBuys: totalCOCIfBuys,
      downPayment: downPayment,
      closingCosts: closingCosts,
      totalEntryFee: totalEntryFee
    };
  }

  function calculateRentalStrategyResults(formData) {
    var subtype = formData['deal-type'] === 'Subject-To'
      ? 'LTR'
      : formData['seller-finance-deal-type'];

    if (subtype === 'Wrap') {
      return calculateWrapResults(formData);
    }

    if (subtype === 'Short Term Rental') {
      return calculateShortTermRentalResults_(formData);
    }

    var occupancyRate = Math.max(0, Math.min(parseNumber(formData.occupancyRate), 100));

    var expenseBreakdown = buildRentalExpenseBreakdown(formData, subtype);
    var totalMonthlyExpenses = sumRentalExpenseRows_(expenseBreakdown);
    var monthlyCashFlow = monthlyIncome - totalMonthlyExpenses;
    var yearlyCashFlow = monthlyCashFlow * 12;
    var entryFeeTotal = calculateEntryFeeTotal_(formData);
    var appreciationAmount = 0;
    var depreciationAmount = 0;
    var combinedYearlyBenefit = yearlyCashFlow;

    return {

      combinedCOC: entryFeeTotal > 0 ? (combinedYearlyBenefit / entryFeeTotal) * 100 : Infinity,
      expenseBreakdown: expenseBreakdown
    };
  }

  function getShortTermScenarioPrefix_(scenario) {

  function calculateShortTermRentalResults_(formData) {

    var monthlyPrincipalDecrease = parseNumber(formData.shortTermMonthlyPrincipalDecrease);

    var equitySplitPercent = Math.max(parseNumber(formData.shortTermEquitySplitPercent), 0);
    var splitPrimaryPercent = Math.max(parseNumber(formData.shortTermSplitPrimaryPercent), 0);
    var splitSecondaryPercent = Math.max(0, 100 - splitPrimaryPercent);
    var ltrMonthlyIncome = getShortTermMonthlyIncome_(formData, 'LTR', incomeSource);
    var airbnbMonthlyIncome = getShortTermMonthlyIncome_(formData, 'AIRBNB', incomeSource);
    var expenseBreakdown = buildShortTermExpenseBreakdown_(formData, scenario, incomeSource);
    var totalMonthlyExpenses = sumRentalExpenseRows_(expenseBreakdown);
    var ltrMonthlyCashFlow = ltrMonthlyIncome - totalMonthlyExpenses;

    var entryFeeTotal = calculateShortTermEntryFeeTotal_(formData);
    var appreciationAmount = 0;

    var yearlyEquitySplit = yearlyPrincipalDecrease * (equitySplitPercent / 100);
    var combinedYearlyBenefit = airbnbYearlyCashFlow + yearlyPrincipalDecrease;
    var cashFlowCOCAsLtr = entryFeeTotal > 0 ? (ltrYearlyCashFlow / entryFeeTotal) * 100 : Infinity;
    var cashFlowCOCAsAirbnb = entryFeeTotal > 0 ? (airbnbYearlyCashFlow / entryFeeTotal) * 100 : Infinity;
    var equityCOC = entryFeeTotal > 0 ? (yearlyPrincipalDecrease / entryFeeTotal) * 100 : Infinity;

    return {

  function calculateWrapResults(formData) {
    var analysisYears = Math.max(parseNumber(formData.wrapAnalysisYears), 1);
    var underlyingMonthlyPayment = parseNumber(formData.wrapMonthlyPayment);
    var buyerSalePrice = parseNumber(formData.wrapBuyerSalePrice);
    var buyerDownPaymentAmount = Math.max(parseNumber(formData.wrapBuyerDownPaymentAmount), 0);
    var buyerLoanTermYears = Math.max(parseNumber(formData.wrapBuyerLoanTermYears), 1);
    var buyerInterestRate = parseNumber(formData.wrapBuyerInterestRate);
    var buyerLoanAmount = Math.max(buyerSalePrice - buyerDownPaymentAmount, 0);
    var calculatedBuyerMonthlyPayment = calculateAmortizedMonthlyPayment_(buyerLoanAmount, buyerInterestRate, buyerLoanTermYears);
    var buyerMonthlyPayment = parseNumber(formData.wrapBuyerMonthlyPayment) || calculatedBuyerMonthlyPayment;
    var grossWrapIncome = buyerMonthlyPayment;
    var wrapPmlMonthly = Math.max(parseNumber(formData.wrapPmlMonthly), 0);
    var wrapPmlYears = Math.max(parseNumber(formData.wrapPmlYears), 0);
    var activePmlYears = wrapPmlMonthly > 0 ? Math.min(Math.max(Math.round(wrapPmlYears), 1), analysisYears) : 0;
    var postPmlYears = Math.max(analysisYears - activePmlYears, 0);
    var expenseBreakdown = buildWrapExpenseBreakdown_(formData, underlyingMonthlyPayment);
    var totalMonthlyExpenses = sumRentalExpenseRows_(expenseBreakdown);
    var totalMonthlyExpensesAfterPml = Math.max(totalMonthlyExpenses - wrapPmlMonthly, 0);
    var monthlyCashFlow = grossWrapIncome - totalMonthlyExpenses;
    var yearlyCashFlow = monthlyCashFlow * 12;
    var monthlyCashFlowAfterPml = grossWrapIncome - totalMonthlyExpensesAfterPml;
    var yearlyCashFlowAfterPml = monthlyCashFlowAfterPml * 12;
    var totalCashFlowDuringPml = yearlyCashFlow * (activePmlYears || analysisYears);
    var totalCashFlowAfterPml = activePmlYears > 0 ? yearlyCashFlowAfterPml * postPmlYears : 0;
    var totalCashFlowProfit = activePmlYears > 0
      ? totalCashFlowDuringPml + totalCashFlowAfterPml
      : yearlyCashFlow * analysisYears;
    var averageYearlyCashFlow = totalCashFlowProfit / analysisYears;
    var entryFeeTotal = calculateEntryFeeTotal_(formData);
    var entryDownPayment = parseNumber(formData.entryDownPayment);
    var downPaymentProfit = buyerDownPaymentAmount - entryDownPayment;
    var averageDownPaymentProfitYearly = downPaymentProfit / analysisYears;
    var totalProfit = totalCashFlowProfit + downPaymentProfit;
    var averageYearlyProfit = totalProfit / analysisYears;
    var askingPrice = parseNumber(formData.wrapBuyerSalePrice);
    var homePriceLoanBalance = parseNumber(formData.homePriceLoanBalance);
    var pmlTotalReturn = wrapPmlMonthly * 12 * activePmlYears;
    var pmlYearlyReturn = activePmlYears > 0 ? pmlTotalReturn / activePmlYears : 0;
    var pmlYearlyCoc = entryFeeTotal > 0 ? (pmlYearlyReturn / entryFeeTotal) * 100 : Infinity;

    return {
      subtype: 'Wrap',
      analysisYears: analysisYears,
      askingPrice: askingPrice,
      homePriceLoanBalance: homePriceLoanBalance,
      wrapPmlYears: wrapPmlYears,
      activePmlYears: activePmlYears,
      postPmlYears: postPmlYears,
      buyerSalePrice: buyerSalePrice,
      buyerDownPaymentAmount: buyerDownPaymentAmount,
      buyerInterestRate: buyerInterestRate,
      buyerLoanTermYears: buyerLoanTermYears,
      buyerLoanAmount: buyerLoanAmount,
      buyerMonthlyPayment: buyerMonthlyPayment,
      calculatedBuyerMonthlyPayment: calculatedBuyerMonthlyPayment,
      grossWrapIncome: grossWrapIncome,
      underlyingMonthlyPayment: underlyingMonthlyPayment,
      wrapPmlMonthly: wrapPmlMonthly,
      totalMonthlyExpenses: totalMonthlyExpenses,
      totalMonthlyExpensesAfterPml: totalMonthlyExpensesAfterPml,
      monthlyCashFlow: monthlyCashFlow,
      yearlyCashFlow: yearlyCashFlow,
      monthlyCashFlowAfterPml: monthlyCashFlowAfterPml,
      yearlyCashFlowAfterPml: yearlyCashFlowAfterPml,
      totalCashFlowDuringPml: totalCashFlowDuringPml,
      totalCashFlowAfterPml: totalCashFlowAfterPml,
      totalCashFlowProfit: totalCashFlowProfit,
      averageYearlyCashFlow: averageYearlyCashFlow,
      entryFeeTotal: entryFeeTotal,
      entryFeePercentOfAskingPrice: askingPrice > 0 ? (entryFeeTotal / askingPrice) * 100 : 0,
      entryFeePercentOfHomePrice: homePriceLoanBalance > 0 ? (entryFeeTotal / homePriceLoanBalance) * 100 : 0,
      entryDownPayment: entryDownPayment,
      downPaymentProfit: downPaymentProfit,
      averageDownPaymentProfitYearly: averageDownPaymentProfitYearly,
      totalProfit: totalProfit,
      averageYearlyProfit: averageYearlyProfit,
      cashFlowCOC: entryFeeTotal > 0 ? (yearlyCashFlow / entryFeeTotal) * 100 : Infinity,
      wrapDownPaymentCOC: entryFeeTotal > 0 ? (averageDownPaymentProfitYearly / entryFeeTotal) * 100 : Infinity,
      pmlTotalReturn: pmlTotalReturn,
      pmlYearlyReturn: pmlYearlyReturn,
      pmlYearlyCoc: pmlYearlyCoc,
      totalCOC: entryFeeTotal > 0 ? (averageYearlyProfit / entryFeeTotal) * 100 : Infinity,
      expenseBreakdown: expenseBreakdown
    };
  }

  function buildRentalExpenseBreakdown(formData, subtype) {

  function calculateYearlyDepreciation_(formData) {
    var basis = Math.max(parseNumber(formData.approximateHomeValue) - parseNumber(formData.salvageValue), 0);
    var years = Math.max(parseNumber(formData.depreciationYears), 1);
    return basis / years;

  function calculateMortgageResults(inputs) {
    var homePrice = parseNumber(inputs.homePrice);
    var downPaymentValue = parseNumber(inputs.downPayment);
    var interestRate = parseNumber(inputs.interestRate);
    var loanTermYears = Math.max(parseNumber(inputs.loanTerm), 1);
    var downPaymentAmount = inputs.downPaymentType === '%' ? homePrice * (downPaymentValue / 100) : downPaymentValue;
    var loanAmount = homePrice - downPaymentAmount;
    var monthlyInterestRate = (interestRate / 100) / 12;
    var numberOfPayments = loanTermYears * 12;
    var monthlyPAndI = 0;

    if (monthlyInterestRate > 0) {
      monthlyPAndI = loanAmount * (monthlyInterestRate * Math.pow(1 + monthlyInterestRate, numberOfPayments)) / (Math.pow(1 + monthlyInterestRate, numberOfPayments) - 1);
    } else {
      monthlyPAndI = loanAmount / numberOfPayments;
    }

    var monthlyTax = 0;
    var monthlyInsurance = 0;
    var monthlyPmi = 0;
    var monthlyHoa = 0;
    var monthlyOther = 0;

    if (inputs.includeTaxes) {
      var propertyTaxesValue = parseNumber(inputs.propertyTaxes);
      var annualTax = inputs.propertyTaxesType === '%' ? homePrice * (propertyTaxesValue / 100) : propertyTaxesValue;
      monthlyTax = annualTax / 12;
      monthlyInsurance = parseNumber(inputs.homeInsurance) / 12;
      monthlyPmi = parseNumber(inputs.pmi) / 12;
      monthlyHoa = parseNumber(inputs.hoa);
      monthlyOther = parseNumber(inputs.otherCosts) / 12;
    }

    var totalOutOfPocket = monthlyPAndI + monthlyTax + monthlyInsurance + monthlyPmi + monthlyHoa + monthlyOther;
    var totalPayment = monthlyPAndI * numberOfPayments;
    var totalInterest = totalPayment - loanAmount;
    var startDate = new Date(parseInt(inputs.startYear, 10), parseInt(inputs.startMonth, 10) - 1, 1);
    var payoffDateObj = new Date(startDate);
    payoffDateObj.setMonth(payoffDateObj.getMonth() + numberOfPayments);
    var payoffDate = payoffDateObj.toLocaleString('default', { month: 'short' }) + ' ' + payoffDateObj.getFullYear();

    return {
      monthlyPayment: monthlyPAndI,
      totalOutOfPocket: totalOutOfPocket,
      totalPayment: totalPayment,
      totalInterest: totalInterest,
      payoffDate: payoffDate,
      loanAmount: loanAmount,
      downPaymentAmount: downPaymentAmount,
      monthly: {
        pAndI: monthlyPAndI,
        propertyTax: monthlyTax,
        homeInsurance: monthlyInsurance,
        otherCosts: monthlyPmi + monthlyHoa + monthlyOther
      },
      total: {
        pAndI: totalPayment,
        propertyTax: monthlyTax * numberOfPayments,
        homeInsurance: monthlyInsurance * numberOfPayments,
        otherCosts: (monthlyPmi + monthlyHoa + monthlyOther) * numberOfPayments
      },
      numberOfPayments: numberOfPayments
    };
  }

  function stringifyInputNumber_(value) {
    var number = Number(value || 0);
    if (!isFinite(number)) {
      return '';
    }

    return String(Math.round(number * 100) / 100);

  function applySharedOperatingExpenseFormulaUpdates_(priceFieldName) {

      ? 'LTR'
      : state.formData['seller-finance-deal-type'];
    var occupancyRate = Math.max(0, Math.min(parseNumber(state.formData.occupancyRate), 100));
    var occupancyMultiplier = occupancyRate / 100;
    var monthlyRent = subtype === 'Padsplit'
      ? parseNumber(state.formData.padsplitWeeklyRate) * 4 * parseNumber(state.formData.rentableBeds) * occupancyMultiplier
      : parseNumber(state.formData.ltrMonthlyRent);
    var holdingMonths = Math.max(parseNumber(state.formData.rentalHoldingMonths || 2), 1);
    var calculatedValues = {
      propertyTaxesPerMonth: calculateMonthlyAmountFromAskingPrice_(askingPrice, 0.01),
      repairsCapexMonthly: calculateMonthlyAmountFromAskingPrice_(askingPrice, 0.01),

      propertyManagementMonthly: Math.max(monthlyRent, 0) * 0.08
    };
    var expenseFormData = Object.assign({}, state.formData, {

      repairsCapexMonthly: stringifyInputNumber_(calculatedValues.repairsCapexMonthly),

    });
    var totalMonthlyExpenses = sumRentalExpenseRows_(buildRentalExpenseBreakdown(expenseFormData, subtype));

    calculatedValues.entryClosingCosts = calculateAmountFromAskingPrice_(askingPrice, 0.03);
    calculatedValues.entryHoldingCosts = totalMonthlyExpenses * holdingMonths;
    calculatedValues.rentalTotalMonthlyExpenses = totalMonthlyExpenses;

    setCalculatedRentalFields_([
      'propertyTaxesPerMonth',
      'repairsCapexMonthly',
      'insuranceMonthly',
      'propertyManagementMonthly',
      'entryClosingCosts',
      'entryHoldingCosts',
      'rentalTotalMonthlyExpenses'
    ]);

    Object.keys(calculatedValues).forEach(function(fieldName) {
      state.formData[fieldName] = stringifyInputNumber_(calculatedValues[fieldName]);
    });

    state.results = null;
    state.leaseOptionResults = null;
    state.strategyResults = null;
    resetWorkbookExportState_();
    render();
  }

  function applyWrapOperatingExpenseFormulaUpdates_() {
    var askingPrice = parseNumber(state.formData.wrapBuyerSalePrice);

    resetWorkbookExportState_();
    setCalculatedRentalFields_([

  function calculateAmortizedMonthlyPayment_(principal, annualRate, termYears) {
    var normalizedPrincipal = Math.max(Number(principal || 0), 0);
    var normalizedYears = Math.max(Number(termYears || 0), 1);
    var numberOfPayments = normalizedYears * 12;

    if (normalizedPrincipal <= 0 || numberOfPayments <= 0) {
      return 0;
    }

    var monthlyRate = (Number(annualRate || 0) / 100) / 12;
    if (monthlyRate <= 0) {
      return normalizedPrincipal / numberOfPayments;
    }

    return normalizedPrincipal * (monthlyRate * Math.pow(1 + monthlyRate, numberOfPayments)) / (Math.pow(1 + monthlyRate, numberOfPayments) - 1);
  }

  var sheetJsLoaderPromise_ = null;

  function loadSheetJs_() {
    if (window.XLSX) {
      return Promise.resolve(window.XLSX);
    }

    if (sheetJsLoaderPromise_) {
      return sheetJsLoaderPromise_;
    }

    sheetJsLoaderPromise_ = new Promise(function (resolve, reject) {
      var script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      script.async = true;
      script.onload = function () {
        if (window.XLSX) {
          resolve(window.XLSX);
          return;
        }

        reject(new Error('SheetJS loaded but XLSX is not available.'));
      };
      script.onerror = function () {
        reject(new Error('Could not load the Excel export library.'));
      };
      document.head.appendChild(script);
    });

    return sheetJsLoaderPromise_;
  }

  function parseCurrencyCandidates(value) {
    var matches = String(value == null ? '' : value).match(/-?\$?\d[\d,]*(?:\.\d+)?/g) || [];
    return matches.map(function (match) {
      return parseNumber(match);
    }).filter(function (candidate) {
      return candidate > 0;
    });
  }

  function extractJsonPayload(text) {
    var source = String(text || '').trim();
    if (!source) {
      throw new Error('The rehab estimate returned an empty response.');
    }

    var fencedMatch = source.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fencedMatch && fencedMatch[1]) {
      return fencedMatch[1].trim();
    }

    var firstBrace = source.indexOf('{');
    var lastBrace = source.lastIndexOf('}');
    if (firstBrace >= 0 && lastBrace > firstBrace) {
      return source.slice(firstBrace, lastBrace + 1);
    }

    return source;
  }

  function normalizeRehabLineItems(items) {
    return (Array.isArray(items) ? items : []).map(function (item) {
      var candidate = item || {};
      var estimatedCostCandidates = parseCurrencyCandidates(candidate.estimatedCost || candidate.estimatedCostText);
      var low = parseNumber(candidate.estimatedCostLow || candidate.low || candidate.minimum || estimatedCostCandidates[0]);
      var high = parseNumber(candidate.estimatedCostHigh || candidate.high || candidate.maximum || estimatedCostCandidates[1] || estimatedCostCandidates[0]);

      if (high > 0 && low > high) {
        var swap = low;
        low = high;
        high = swap;
      }

      return {
        item: String(candidate.item || candidate.label || 'Line Item').trim(),
        scopeOfWork: String(candidate.scopeOfWork || candidate.scope || candidate.description || '').trim(),
        estimatedCostLow: low,
        estimatedCostHigh: high || low
      };
    }).filter(function (item) {
      return item.item || item.scopeOfWork || item.estimatedCostLow || item.estimatedCostHigh;
    });
  }

  function parseGeneratedRehabResponse(text, fallbackFormData) {
    var payload = JSON.parse(extractJsonPayload(text));
    var lineItems = normalizeRehabLineItems(payload.lineItems);
    var totalRepairLow = parseNumber(payload.totalRepairLow);
    var totalRepairHigh = parseNumber(payload.totalRepairHigh);
    var recommendedBudget = parseNumber(payload.recommendedBudget);

    if ((!totalRepairLow || !totalRepairHigh) && lineItems.length > 0) {
      totalRepairLow = lineItems.reduce(function (sum, item) { return sum + Number(item.estimatedCostLow || 0); }, 0);
      totalRepairHigh = lineItems.reduce(function (sum, item) { return sum + Number(item.estimatedCostHigh || 0); }, 0);
    }

    if (totalRepairHigh > 0 && totalRepairLow > totalRepairHigh) {
      var swap = totalRepairLow;
      totalRepairLow = totalRepairHigh;
      totalRepairHigh = swap;
    }

    if (!recommendedBudget && totalRepairLow && totalRepairHigh) {
      recommendedBudget = Math.round((totalRepairLow + totalRepairHigh) / 2);
    }
    if (!recommendedBudget) {
      recommendedBudget = totalRepairHigh || totalRepairLow;
    }

    if (!recommendedBudget) {
      throw new Error('The rehab estimate did not return a usable recommended budget.');
    }

    var rehabMode = getRehabModeConfig_();

    return {
      propertyAddress: String(payload.propertyAddress || fallbackFormData.address || '').trim(),
      beds: parseNumber(payload.beds || fallbackFormData.beds),
      baths: parseNumber(payload.baths || fallbackFormData.baths),
      conditionSummary: String(payload.conditionSummary || '').trim(),
      lineItems: lineItems,
      totalRepairLow: totalRepairLow,
      totalRepairHigh: totalRepairHigh,
      recommendedBudget: recommendedBudget,
      appliedRepairLabel: rehabMode.appliedRepairLabel
    };
  }

  function normalizeComparablesWarnings_(warnings) {
    if (Array.isArray(warnings)) {
      return warnings.map(function (warning) {

    if (warnings == null || warnings === '') {

    return [String(warnings).trim()].filter(Boolean);

  function normalizeComparableRows_(rows) {
    return (Array.isArray(rows) ? rows : []).map(function (row) {
      var candidate = row || {};
      return {
        address: String(candidate.address || candidate.propertyAddress || 'Comparable').trim(),
        distanceMiles: parseNumber(candidate.distanceMiles || candidate.distance || candidate.proximity),
        saleDate: String(candidate.saleDate || candidate.soldDate || candidate.dateSold || '').trim(),
        beds: parseNumber(candidate.beds),
        baths: parseNumber(candidate.baths),
        sqft: parseNumber(candidate.sqft || candidate.squareFeet || candidate.livingArea),
        soldPrice: parseNumber(candidate.soldPrice || candidate.salePrice || candidate.price),
        pricePerSqft: parseNumber(candidate.pricePerSqft || candidate.ppsf || candidate.avgPricePerSqft),
        selectionReason: String(candidate.selectionReason || candidate.reason || '').trim()
      };
    }).filter(function (row) {
      return row.address || row.soldPrice || row.pricePerSqft;
    }).slice(0, 5);

  function parseGeneratedComparablesResponse(text, fallbackFormData) {
    var payload = JSON.parse(extractJsonPayload(text));
    var bestComparables = normalizeComparableRows_(payload.bestComparables);
    var averagePricePerSqft = parseNumber(payload.averagePricePerSqft || payload.avgPricePerSqft || payload.averagePpsf);
    var subjectSqft = parseNumber(payload.subjectSqft || fallbackFormData.sqft);
    var recommendedValue = parseNumber(payload.recommendedValue || payload.recommendedArv || payload.approximateHomeValue || payload.arv);
    var comparablePpsfValues = bestComparables.map(function (row) {
      return Number(row.pricePerSqft || 0);
    }).filter(function (value) {
      return value > 0;
    });

    if (!averagePricePerSqft && comparablePpsfValues.length > 0) {
      averagePricePerSqft = comparablePpsfValues.reduce(function (sum, value) {
        return sum + value;
      }, 0) / comparablePpsfValues.length;
    }

    if (!recommendedValue && averagePricePerSqft && subjectSqft) {
      recommendedValue = Math.round(averagePricePerSqft * subjectSqft);
    }

    if (!recommendedValue) {
      throw new Error('The comparable analysis did not return a usable property value.');
    }

    if (bestComparables.length === 0) {
      throw new Error('The comparable analysis did not return any usable comparable sales.');
    }

    var warnings = normalizeComparablesWarnings_(payload.warnings);
    if (bestComparables.length < 5) {
      warnings.push('Fewer than 5 qualified sold comparables were available in the uploaded CSV, so the best available comps were used.');
    }

    var modeConfig = getComparablesModeConfig_();

    return {
      propertyAddress: String(payload.propertyAddress || fallbackFormData.address || '').trim(),
      subjectBeds: parseNumber(payload.subjectBeds || fallbackFormData.beds),
      subjectBaths: parseNumber(payload.subjectBaths || fallbackFormData.baths),
      subjectSqft: subjectSqft,
      averagePricePerSqft: averagePricePerSqft,
      recommendedValue: recommendedValue,
      selectedComparableCount: parseNumber(payload.selectedComparableCount) || bestComparables.length,
      marketSummary: String(payload.marketSummary || '').trim(),
      warnings: warnings,
      bestComparables: bestComparables,

  async function callBrowserGemini(payload) {
    var apiKey = state.browserApiKey.trim();
    if (!apiKey) {
      throw new Error('Enter a Gemini API key in the AI Runtime card before using AI tools.');
    }

    var parts = [{ text: payload.prompt }];

    if (payload.images && payload.images.length > 0) {
      payload.images.forEach(function (img) {
        parts.push({ inline_data: { mime_type: img.mimeType, data: img.data } });
      });
    }

    var body = { contents: [{ parts: parts }] };

    if (payload.useSearch) {
      body.tools = [{ googleSearch: {} }];
    }

    var endpoint = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(apiKey);
    var response = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!response.ok && payload.useSearch) {
      return callBrowserGemini({ prompt: payload.prompt, images: payload.images, useSearch: false });
    }

    if (!response.ok) {
      var message = await response.text();
      throw new Error(message || 'Gemini request failed.');
    }

    var data = await response.json();
    return extractGeminiText(data);
  }

  function extractGeminiText(data) {
    var parts = (((data || {}).candidates || [])[0] || {}).content;
    var textParts = (parts && parts.parts) || [];
    var text = textParts.map(function (part) { return part.text || ''; }).join('').trim();

    if (!text) {
      throw new Error('Gemini returned an empty response.');
    }

    return text;
  }

    });

    rows.push([], ['Next Steps']);
    (summaryData.nextSteps || []).forEach(function (item) {
      rows.push([item]);
    });

    return rows;
  }

  function buildRehabSheetRows_() {
    if (!state.generatedRehabData) {
      return [['No rehab summary is available for this analysis.']];
    }

    var rows = [
      ['Property Address', state.generatedRehabData.propertyAddress || ''],
      ['Condition Summary', state.generatedRehabData.conditionSummary || ''],
      ['Recommended Budget', formatCurrency(state.generatedRehabData.recommendedBudget, 0)],
      [],
      ['Item', 'Scope of Work', 'Estimated Cost Range']
    ];

    state.generatedRehabData.lineItems.forEach(function (item) {
      rows.push([item.item, item.scopeOfWork || '', formatCurrencyRange(item.estimatedCostLow, item.estimatedCostHigh)]);
    });

    return rows;
  }

  function buildComparablesSheetRows_() {
    if (!state.generatedComparablesData) {
      return [['No comparable summary is available for this analysis.']];
    }

    var rows = [
      ['Property Address', state.generatedComparablesData.propertyAddress || ''],
      ['Summary', state.generatedComparablesData.marketSummary || ''],
      ['Recommended Value', formatCurrency(state.generatedComparablesData.recommendedValue, 0)],
      ['Average PPSF', formatCurrency(state.generatedComparablesData.averagePricePerSqft, 2)],
      [],
      ['Address', 'Distance Miles', 'Sale Date', 'Beds', 'Baths', 'Sqft', 'Sold Price', 'Price / Sqft', 'Selection Reason']
    ];

    state.generatedComparablesData.bestComparables.forEach(function (row) {
      rows.push([
        row.address,
        row.distanceMiles,
        row.saleDate,
        row.beds,
        row.baths,
        row.sqft,
        formatCurrency(row.soldPrice, 0),
        formatCurrency(row.pricePerSqft, 2),
        row.selectionReason || ''
      ]);
    });

    if (state.generatedComparablesData.warnings && state.generatedComparablesData.warnings.length) {
      rows.push([], ['Warnings']);
      state.generatedComparablesData.warnings.forEach(function (warning) {
        rows.push([warning]);
      });
    }

    return rows;
  }

  function buildWorkbookArrayBuffer_(XLSX, context, summaryData) {
    var workbook = XLSX.utils.book_new();
    appendSheetFromAoa_(workbook, XLSX, 'Executive Summary', buildExecutiveSummaryRows_(context, summaryData));
    appendSheetFromAoa_(workbook, XLSX, 'Analysis', [['Metric', 'Value']].concat(buildMetricSheetRows_(context)));
    appendSheetFromAoa_(workbook, XLSX, 'Inputs', [['Input', 'Value']].concat(buildInputSheetRows_(context)));
    appendSheetFromAoa_(workbook, XLSX, 'Rehab', buildRehabSheetRows_());
    appendSheetFromAoa_(workbook, XLSX, 'Comparables', buildComparablesSheetRows_());
    return XLSX.write(workbook, { type: 'array', bookType: 'xlsx' });
  }

  async function prepareWorkbookExport_() {
    var context = getActiveAnalysisContext_();
    if (!context) {
      return;
    }

    var contextKey = context.type + '|' + String(state.formData.address || '');
    resetWorkbookExportState_();
    state.exportWorkbook.preparing = true;
    state.exportWorkbook.contextKey = contextKey;
    render();

    try {
      var summaryData = buildWorkbookSummaryFallback_(context);

      try {
        if (state.browserApiKey.trim()) {
          var summaryText = await callBrowserGemini({ prompt: buildWorkbookSummaryPrompt_(context), useSearch: false });
          summaryData = parseWorkbookSummaryResponse_(summaryText, context);
        }
      } catch (summaryError) {
        summaryData = buildWorkbookSummaryFallback_(context);
      }

      var XLSX = await loadSheetJs_();
      var workbookArray = buildWorkbookArrayBuffer_(XLSX, context, summaryData);
      var blob = new Blob([workbookArray], {
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      });

      state.exportWorkbook.preparing = false;
      state.exportWorkbook.error = '';
      state.exportWorkbook.summaryData = summaryData;
      state.exportWorkbook.fileName = buildWorkbookFileName_(context);
      state.exportWorkbook.downloadUrl = URL.createObjectURL(blob);
      state.exportWorkbook.generatedAt = formatDateTimeLabel_(new Date());
      state.exportWorkbook.contextKey = contextKey;
    } catch (error) {
      state.exportWorkbook.preparing = false;
      state.exportWorkbook.error = error.message || 'Could not generate the Excel workbook.';
      state.exportWorkbook.summaryData = null;
      state.exportWorkbook.fileName = '';
      state.exportWorkbook.downloadUrl = '';
      state.exportWorkbook.generatedAt = '';
      state.exportWorkbook.contextKey = contextKey;
    }

    render();
  }

  function handleInput(event) {
    var target = event.target;
    if (!(target instanceof HTMLElement)) return;

    if (target.id === 'rehabChatInput') {
      state.rehabChat.draft = target.value;
      return;
    }

    if (target.getAttribute('data-model') === 'form') {
      state.formData[target.id] = target.type === 'checkbox' ? target.checked : target.value;
      clearCalculatedRentalField_(target.id);
      invalidateAnalyzerOutputs_();
      if (target.id === 'deal-type') {
        resetGeneratedRehabState(true);
        resetGeneratedComparablesState(true);
        state.rehabImages = [];
      }
      if (isRehabSourceField(target.id)) {
        resetGeneratedRehabState(true);
      }
      if (isComparablesSourceField(target.id)) {
        resetGeneratedComparablesState(true);
      }
      if (target.id === 'deal-type' || target.id === 'seller-finance-deal-type') {
        state.leaseOptionResults = null;
        state.strategyResults = null;
      }
      return;
    }

    if (target.getAttribute('data-model') === 'mortgage') {
      state.mortgage[target.id] = target.type === 'checkbox' ? target.checked : target.value;
      return;
    }

    if (target.id === 'browserApiKey') {
      state.browserApiKey = target.value;
    }
    if (target.id === 'sessionOnlyCheck') {
      state.useSessionOnly = target.checked;
    }
  }

  function handleChange(event) {
    var target = event.target;
    if (!(target instanceof HTMLElement)) return;

    if (target.id === 'comparablesFile' && target.files && target.files[0]) {
      handleComparablesUpload(target.files[0]);
      return;
    }

    if (target.id === 'rehabImageInput' && target.files && target.files.length > 0) {
      handleMultipleRehabImages(target.files);
      target.value = '';
      return;
    }

    if (target.id === 'rehabImageFolderInput' && target.files && target.files.length > 0) {
      handleMultipleRehabImages(target.files);
      target.value = '';
      return;
    }

    if (target.getAttribute('data-model') === 'form' || target.getAttribute('data-model') === 'mortgage') {
      render();
      return;
    }

    if (target.tagName === 'SELECT' || target.type === 'checkbox') {
      render();
    }
  }

  function handleClick(event) {
    var actionTarget = event.target.closest('[data-action]');
    if (!actionTarget) return;

    var action = actionTarget.getAttribute('data-action');

    if (action === 'toggle') {
      state.formData[actionTarget.getAttribute('data-name')] = actionTarget.getAttribute('data-value');
      invalidateAnalyzerOutputs_();
      render();
      return;
    }

    if (action === 'calculate-operating-expenses') {
      var scope = String(actionTarget.getAttribute('data-calc-scope') || '').trim();

      if (scope === 'rental') {
        applySharedOperatingExpenseFormulaUpdates_('homePriceLoanBalance');
      } else if (scope === 'wrap') {
        applyWrapOperatingExpenseFormulaUpdates_();
      } else if (scope === 'short-term-as-is') {
        applyShortTermOperatingExpenseFormulaUpdates_('shortTermAsIsValue', 'shortTermAsIs');
      } else if (scope === 'short-term-offer') {
        applyShortTermOperatingExpenseFormulaUpdates_('shortTermPriceToOffer', 'shortTermOffer');
      }

      return;
    }

    if (action === 'calculate-wrap-down-payment') {
      calculateWrapBuyerDownPaymentAmount_();
      return;
    }

    if (action === 'save-api-key') {
      storeApiKey(state.browserApiKey.trim(), state.useSessionOnly);
      setSessionOnlyFlag(state.useSessionOnly);
      render();
      return;
    }

    if (action === 'clear-api-key') {
      state.browserApiKey = '';
      state.useSessionOnly = false;
      clearApiKey();
      setSessionOnlyFlag(false);
      render();
      return;
    }

    if (action === 'analyze-fix-flip') {
      handleAnalyzeFixAndFlip();
      return;
    }

    if (action === 'back-to-form') {
      state.view = 'form';
      render();
      return;
    }

    if (action === 'analyze-lease-option') {
      state.analysisError = '';
      state.leaseOptionResults = calculateLeaseOptionResults(state.formData);
      render();
      prepareWorkbookExport_();
      return;
    }

    if (action === 'analyze-rental-strategy') {
      handleAnalyzeSellerFinanceStrategy();
      return;
    }

    if (action === 'remove-rehab-image') {
      var index = parseInt(actionTarget.getAttribute('data-index'), 10);
      if (!isNaN(index)) {
        state.rehabImages.splice(index, 1);
        resetGeneratedRehabState(true);
      }
      render();
      return;
    }

    if (action === 'generate-rehab') {
      handleGenerateRehabReport();
      return;
    }

    if (action === 'send-rehab-chat') {
      handleSendRehabChatMessage();
      return;
    }

    if (action === 'clear-rehab-chat') {
      resetRehabChatState_();
      render();
      return;
    }

    if (action === 'mark-no-repairs') {
      handleMarkNoRepairs();
      return;
    }

    if (action === 'analyze-rents') {
      handleAnalyzeRents();
      return;
    }

    if (action === 'calculate-mortgage') {
      state.mortgageResults = calculateMortgageResults(state.mortgage);
      applyMortgageResultsToSellerFinanceLtr_(state.mortgageResults);
      render();
      return;
    }

    if (action === 'clear-mortgage') {
      state.mortgage = {
        homePrice: '',
        downPayment: '',
        downPaymentType: '%',
        loanTerm: '30',
        interestRate: '',
        startMonth: String(new Date().getMonth() + 1),
        startYear: String(new Date().getFullYear()),
        includeTaxes: true,
        propertyTaxes: '',
        propertyTaxesType: '%',
        homeInsurance: '',
        pmi: '',
        hoa: '',
        otherCosts: ''
      };
      state.mortgageResults = null;
      render();
    }
  }

  async function handleAnalyzeFixAndFlip() {
    var gate = getFixFlipAnalyzeGate();
    if (!gate.ready) {
      state.analysisError = gate.message;
      render();
      return;
    }

    state.analysisError = '';
    state.aiRepairSummary = '';
    state.aiRepairSummaryError = '';
    state.loading.analyzing = true;
    render();

    try {
      state.results = calculateFixAndFlipResults(state.formData);
      state.aiRepairSummary = state.generatedRehabReport;
      render();
      await prepareWorkbookExport_();
    } catch (error) {
      state.analysisError = error.message;
    } finally {
      state.loading.analyzing = false;
      render();
    }
  }

  async function handleMultipleRehabImages(files) {
    var normalized = normalizeRehabImageFiles_(files);

    state.rehabImageError = '';
    resetGeneratedRehabState(true);

    if (!normalized.acceptedFiles.length) {
      state.rehabImageError = normalized.totalCount
        ? 'No valid image files were found in that selection.'
        : 'No image files were selected.';
      render();
      return;
    }

    for (var i = 0; i < normalized.acceptedFiles.length; i++) {
      try {
        var result = await readFileAsBase64(normalized.acceptedFiles[i]);
        state.rehabImages.push(result);
      } catch (error) {
        state.rehabImageError = error.message;
      }
    }

    if (!state.rehabImageError && normalized.skippedCount > 0) {
      state.rehabImageError = normalized.skippedCount + ' non-image file(s) were skipped.';
    }

    render();
  }

  async function handleGenerateRehabReport() {
    var previousAddress = state.formData.address;
    var previousBeds = state.formData.beds;
    var previousBaths = state.formData.baths;
    var rehabPrompt = buildRehabPrompt(state.formData);

    state.generatedRehabError = '';
    state.generatedRehabPrompt = '';
    state.generatedRehabReport = '';
    state.generatedRehabData = null;
    state.loading.generatingRehab = true;
    render();

    try {
      var images = state.rehabImages.length > 0 ? state.rehabImages : undefined;
      state.generatedRehabPrompt = rehabPrompt;
      state.generatedRehabReport = await callBrowserGemini({ prompt: rehabPrompt, images: images, useSearch: false });
      state.generatedRehabData = parseGeneratedRehabResponse(state.generatedRehabReport, state.formData);
      state.formData.address = state.generatedRehabData.propertyAddress || state.formData.address;
      state.formData.beds = String(state.generatedRehabData.beds || state.formData.beds || '');
      state.formData.baths = String(state.generatedRehabData.baths || state.formData.baths || '');
      setRepairDestinationValue_(Math.round(state.generatedRehabData.recommendedBudget || 0));

      if (state.formData.address !== previousAddress || state.formData.beds !== previousBeds || state.formData.baths !== previousBaths) {
        resetGeneratedComparablesState(true);
      }
    } catch (error) {
      state.generatedRehabPrompt = '';
      state.generatedRehabData = null;
      state.generatedRehabError = error.message;
    } finally {
      state.loading.generatingRehab = false;
      render();
    }
  }

  function handleMarkNoRepairs() {
    resetGeneratedRehabState(true);
    state.generatedRehabData = buildNoRepairsRehabData_();
    state.generatedRehabReport = JSON.stringify(state.generatedRehabData);
    state.generatedRehabError = '';
    setRepairDestinationValue_(0);
    render();
  }

  async function handleSendRehabChatMessage() {
    var userMessage = String(state.rehabChat.draft || '').trim();

    if (!state.generatedRehabData || !state.generatedRehabReport || !state.generatedRehabPrompt) {
      state.rehabChat.error = 'Generate an AI rehab estimate first before using the rehab chat.';
      render();
      return;
    }

    if (!userMessage) {
      state.rehabChat.error = 'Enter a rehab question first.';
      render();
      return;
    }

    state.rehabChat.error = '';
    state.loading.chattingRehab = true;
    state.rehabChat.messages.push({ role: 'user', text: userMessage });
    state.rehabChat.draft = '';
    render();

    try {
      var reply = await callBrowserGemini({
        prompt: buildRehabChatPrompt_(userMessage),
        useSearch: false
      });

      state.rehabChat.messages.push({ role: 'assistant', text: reply });
    } catch (error) {
      state.rehabChat.error = error && error.message ? error.message : String(error);
    } finally {
      state.loading.chattingRehab = false;
      render();
    }
  }

  async function handleAnalyzeSellerFinanceStrategy() {
    var gate = getSellerFinanceAnalyzeGate();
    var dealLabel = getCreativeDealLabel_();
    if (!gate.ready) {
      state.analysisError = gate.message;
      render();
      return;
    }

    state.analysisError = '';
    state.loading.analyzing = true;
    render();

    try {
      state.strategyResults = calculateRentalStrategyResults(state.formData);
      render();
      await prepareWorkbookExport_();
    } catch (error) {
      state.analysisError = error.message || 'Could not analyze this ' + dealLabel.toLowerCase() + ' deal.';
    } finally {
      state.loading.analyzing = false;
      render();
    }
  }

  function handleDragOver(event) {
    var uploadTarget = event.target && event.target.closest ? event.target.closest('[data-upload-type]') : null;
    if (!uploadTarget) return;
    event.preventDefault();
    uploadTarget.classList.add('is-dragover');
  }

  function handleDragLeave(event) {
    var uploadTarget = event.target && event.target.closest ? event.target.closest('[data-upload-type]') : null;
    if (!uploadTarget) return;

    if (event.relatedTarget && uploadTarget.contains(event.relatedTarget)) {
      return;
    }

    uploadTarget.classList.remove('is-dragover');
  }

  function handleDrop(event) {
    var uploadTarget = event.target && event.target.closest ? event.target.closest('[data-upload-type]') : null;
    if (!uploadTarget) return;

    event.preventDefault();
    uploadTarget.classList.remove('is-dragover');

  var files = event.dataTransfer && event.dataTransfer.files;
  if (files && files[0]) {
    var uploadType = uploadTarget.getAttribute('data-upload-type');
    if (uploadType === 'comparables') {
      handleComparablesUpload(files[0]);
      return;
    }

    if (uploadType === 'rehab-images') {
      handleMultipleRehabImages(files);
    }
  }
}

  async function handleAnalyzeRents() {
    if (!state.formData.rentalAnalysisCity.trim()) {
      state.rentAnalysisError = 'Enter a city before running the rental analysis.';
      render();
      return;
    }

    state.rentAnalysisResult = '';
    state.rentAnalysisError = '';
    state.loading.analyzingRents = true;
    render();

    try {
      state.rentAnalysisResult = await callBrowserGemini({ prompt: buildLocalRentsPrompt(state.formData.rentalAnalysisCity), useSearch: true });
    } catch (error) {
      state.rentAnalysisError = error.message;
    } finally {
      state.loading.analyzingRents = false;
      render();
    }
  }

  async function handleComparablesUpload(file) {
    state.comparablesFileName = file.name;
    state.comparablesAnalysis = '';
    state.comparablesError = '';
    state.generatedComparablesData = null;
    state.loading.analyzingComparables = true;
    render();

    try {
      var csvText = await readFileAsText(file);
      state.comparablesAnalysis = await callBrowserGemini({ prompt: buildComparablesPrompt(state.formData, csvText), useSearch: false });
      state.generatedComparablesData = parseGeneratedComparablesResponse(state.comparablesAnalysis, state.formData);
      state.formData.address = state.generatedComparablesData.propertyAddress || state.formData.address;
      setComparableDestinationValue_(Math.round(state.generatedComparablesData.recommendedValue || 0));
    } catch (error) {
      state.generatedComparablesData = null;
      state.comparablesError = error.message;
    } finally {
      state.loading.analyzingComparables = false;
      render();
    }
  }

      results ? '<div class="da-kpi-grid da-kpi-grid-mortgage"><div class="da-kpi"><p class="da-kpi-label">Monthly Pay</p><p class="da-kpi-value da-kpi-value-compact">' + formatCurrency(results.monthlyPayment) + '</p></div><div class="da-kpi"><p class="da-kpi-label">Total Out-of-Pocket</p><p class="da-kpi-value da-kpi-value-compact">' + formatCurrency(results.totalOutOfPocket) + '</p></div><div class="da-kpi"><p class="da-kpi-label">Mortgage Payoff</p><p class="da-kpi-value da-kpi-value-compact">' + escapeHtml(results.payoffDate) + '</p></div></div>' : '',
      results ? '<div class="da-figure"><table class="da-table"><thead><tr><th>Line Item</th><th>Monthly</th><th>Total</th></tr></thead><tbody><tr><td>Mortgage Payment</td><td>' + formatCurrency(results.monthly.pAndI) + '</td><td>' + formatCurrency(results.total.pAndI) + '</td></tr><tr><td>Property Tax</td><td>' + formatCurrency(results.monthly.propertyTax) + '</td><td>' + formatCurrency(results.total.propertyTax) + '</td></tr><tr><td>Home Insurance</td><td>' + formatCurrency(results.monthly.homeInsurance) + '</td><td>' + formatCurrency(results.total.homeInsurance) + '</td></tr><tr><td>Other Costs</td><td>' + formatCurrency(results.monthly.otherCosts) + '</td><td>' + formatCurrency(results.total.otherCosts) + '</td></tr><tr class="da-table-total"><td>Total Out-of-Pocket</td><td>' + formatCurrency(results.totalOutOfPocket) + '</td><td>' + formatCurrency(results.totalOutOfPocket * results.numberOfPayments) + '</td></tr></tbody></table></div>' : '',
      results ? '<div class="da-summary-list">' + renderSummaryRow('House Price', formatCurrency(parseNumber(state.mortgage.homePrice))) + renderSummaryRow('Loan Amount', formatCurrency(results.loanAmount)) + renderSummaryRow('Down Payment', formatCurrency(results.downPaymentAmount)) + renderSummaryRow('Total of Mortgage Payments', formatCurrency(results.totalPayment)) + renderSummaryRow('Total Interest', formatCurrency(results.totalInterest)) + renderSummaryRow('Mortgage Payoff Date', results.payoffDate) + '</div>' : '<div class="da-note">Run the calculator to see payment breakdowns and payoff timing.</div>',
      '</div>',
      '</div>',
      '</div></div>'
    ].join('');
  }

  function renderResultsPage() {
    if (!state.results) {
      return '<div class="da-card"><div class="da-card-inner"><div class="da-error">No results are available yet.</div></div></div>';
    }

    var results = state.results;

    var wholesaleRows = [
      renderResultRow('ARV', formatCurrency(results.arv), 'da-table-highlight'),
      renderResultRow('Repair Cost', formatCurrency(results.repairs)),
      renderResultRow('Present Value', formatCurrency(results.presentValue)),
      renderResultRow('Flippers Price', formatCurrency(results.flippersPrice), 'da-table-highlight'),
      renderResultRow('Gross Wholesale Fee', formatCurrency(results.wholesaleFee)),
      renderResultRow('Average Fee (2%)', formatCurrency(results.averageFee)),
      renderResultRow('Lowest, First Offer', formatCurrency(results.lowestFirstOffer)),
      renderResultRow('Purchase Price / Seller Ask', formatCurrency(results.askingPrice)),
      renderResultRow('Flippers Maximum Price', formatCurrency(results.flippersMaximumPrice), 'da-table-total'),
      renderResultRow('Max Wholesale Price', formatCurrency(results.maxWholesalePrice), 'da-table-total')
    ];

    var hardMoneyRows = [
      renderResultRow('Flippers Price', formatCurrency(results.hardMoneyScenario.flippersPrice)),
      renderResultRow('Repairs', formatCurrency(results.hardMoneyScenario.repairs)),
      renderResultRow('Flipper Price + Repair Total', formatCurrency(results.hardMoneyScenario.pricePlusRepairs), 'da-table-highlight'),
      renderResultRow('Down payment percentage', formatPercent(results.downPaymentPercentage)),
      renderResultRow('Down payment on hard money', formatCurrency(results.hardMoneyScenario.downPaymentOnHardMoney)),
      renderResultRow('Total Loan Amount', formatCurrency(results.hardMoneyScenario.totalLoanAmount)),
      renderResultRow('Hard Money interest rate', formatPercent(results.hardMoneyScenario.hardMoneyInterestRate)),
      renderResultRow('Amortization', results.hardMoneyScenario.amortization + ' years'),
      renderResultRow('Holding Monthly payment', formatCurrency(results.hardMoneyScenario.holdingMonthlyPayment)),
      renderResultRow('Number of Months Holding', results.hardMoneyScenario.holdingMonths),
      renderResultRow('Total Hard Money Payments when Flipped', formatCurrency(results.hardMoneyScenario.totalHardMoneyPayments)),
      renderResultRow('PML', formatCurrency(results.hardMoneyScenario.pmlAmount), 'da-table-highlight'),
      renderResultRow('Annual interest rate', formatPercent(results.hardMoneyScenario.annualInterestRate)),
      renderResultRow('Monthly payment', formatCurrency(results.hardMoneyScenario.pmlMonthlyPayment)),
      renderResultRow('Total Interest over Holding months', formatCurrency(results.hardMoneyScenario.totalInterestOverHoldingMonths)),
      renderResultRow('Total PML Pay when Flip sells', formatCurrency(results.hardMoneyScenario.totalPmlPayWhenFlipSells)),
      renderResultRow('Closing Costs', formatCurrency(results.hardMoneyScenario.closingCosts)),
      renderResultRow('Realtor Fees', formatCurrency(results.hardMoneyScenario.realtorFees)),
      renderResultRow('Total Costs to Flip', formatCurrency(results.hardMoneyScenario.totalCostsToFlip), 'da-table-total'),
      renderResultRow('ARV', formatCurrency(results.arv), 'da-table-highlight'),
      renderResultRow('Actual Profit', formatCurrency(results.hardMoneyScenario.actualProfit), 'da-table-total'),
      renderResultRow('Actual Profit %', formatPercent(results.hardMoneyScenario.actualProfitPercent))
    ];

    var straightPmlRows = [
      renderResultRow('Flippers Price', formatCurrency(results.straightPmlScenario.flippersPrice)),
      renderResultRow('Repairs', formatCurrency(results.straightPmlScenario.repairs)),
      renderResultRow('Flipper Price + Repair Total', formatCurrency(results.straightPmlScenario.pricePlusRepairs), 'da-table-highlight'),
      renderResultRow('Down payment percentage', formatPercent(results.straightPmlScenario.downPaymentPercentage)),
      renderResultRow('Down payment on the Hard money', formatCurrency(results.straightPmlScenario.downPaymentOnHardMoney)),
      renderResultRow('Total Loan Amount', formatCurrency(results.straightPmlScenario.totalLoanAmount)),
      renderResultRow('PML', formatCurrency(results.straightPmlScenario.pmlAmount), 'da-table-highlight'),
      renderResultRow('Number of Months Holding', results.straightPmlScenario.holdingMonths),
      renderResultRow('Annual interest rate', formatPercent(results.straightPmlScenario.annualInterestRate)),
      renderResultRow('Monthly payment', formatCurrency(results.straightPmlScenario.monthlyPayment)),
      renderResultRow('Total interest over Holding months', formatCurrency(results.straightPmlScenario.totalInterestOverHoldingMonths)),
      renderResultRow('Difference owed at sale', formatCurrency(results.straightPmlScenario.differenceOwedAtSale)),
      renderResultRow('Total PML Loan payment at rate', formatCurrency(results.straightPmlScenario.totalPmlLoanPaymentAtRate)),
      renderResultRow('Closing Costs', formatCurrency(results.straightPmlScenario.closingCosts)),
      renderResultRow('Realtor Fees', formatCurrency(results.straightPmlScenario.realtorFees)),
      renderResultRow('Total Costs to Flip', formatCurrency(results.straightPmlScenario.totalCostsToFlip), 'da-table-total'),
      renderResultRow('ARV', formatCurrency(results.arv), 'da-table-highlight'),
      renderResultRow('Actual Profit', formatCurrency(results.straightPmlScenario.actualProfit), 'da-table-total'),
      renderResultRow('Actual Profit %', formatPercent(results.straightPmlScenario.actualProfitPercent))
    ];

    var maoRows = [
      renderResultRow('Desired Profit Margin', formatPercent(results.desiredProfitMarginPercent)),
      renderResultRow('Total Costs to Flip', formatCurrency(results.totalCostsToFlip), 'da-table-total'),
      renderResultRow('ARV', formatCurrency(results.arv), 'da-table-highlight'),
      renderResultRow('Desired profit 20% of Cost', formatCurrency(results.desiredProfitAmount)),
      renderResultRow('Difference between Actual and Desired Profit', formatCurrency(results.differenceBetweenActualAndDesiredProfit), 'da-table-total'),
      renderResultRow('Repairs', formatCurrency(results.repairs)),
      renderResultRow('Total Hard Money Payments when Flipped', formatCurrency(results.totalHardMoneyPayments)),
      renderResultRow('Closing Costs', formatCurrency(results.closingCosts)),
      renderResultRow('Realtor Fees', formatCurrency(results.realtorFees)),
      renderResultRow('Total Fixed Costs', formatCurrency(results.totalFixedCosts)),
      renderResultRow('Maximum Purchase Price Formula', formatCurrency(results.maximumPurchasePriceFormula), 'da-table-highlight'),
      renderResultRow('Flippers Maximum Price', formatCurrency(results.flippersMaximumPrice), 'da-table-total'),
      renderResultRow('Wholesale Fee', formatCurrency(results.wholesaleFee)),
      renderResultRow('Max Wholesale Price', formatCurrency(results.maxWholesalePrice), 'da-table-total')
    ];

    return [
      '<div class="da-section-spacer da-card"><div class="da-card-inner da-stack">',
      '<div class="da-card-title-row"><h2 class="da-card-title">Fix & Flip Analysis Output</h2><span class="da-badge">Bottom-of-page breakdown</span></div>',
      results.usedAutoPurchasePrice ? '<div class="da-note">Purchase Price was left blank, so Deal Cannon used the spreadsheet-style flippers price formula to populate the scenario outputs automatically.</div>' : '',
      '<div class="da-grid-2">',
      '<div class="da-card"><div class="da-card-inner"><div class="da-card-title-row"><h3 class="da-card-title">Wholesale Calculator</h3></div><div class="da-figure"><table class="da-table"><thead><tr><th>Line Item</th><th>Value</th></tr></thead><tbody>' + wholesaleRows.join('') + '</tbody></table></div></div></div>',
      '<div class="da-card"><div class="da-card-inner"><div class="da-card-title-row"><h3 class="da-card-title">Maximum Allowable Offer (MAO)</h3></div><div class="da-figure"><table class="da-table"><thead><tr><th>Line Item</th><th>Value</th></tr></thead><tbody>' + maoRows.join('') + '</tbody></table></div></div></div>',
      '</div>',
      '<div class="da-grid-2">',
      '<div class="da-card"><div class="da-card-inner"><div class="da-card-title-row"><h3 class="da-card-title">Cost w/ Hard Money + PML</h3></div><div class="da-figure"><table class="da-table"><thead><tr><th>Line Item</th><th>Value</th></tr></thead><tbody>' + hardMoneyRows.join('') + '</tbody></table></div></div></div>',
      '<div class="da-card"><div class="da-card-inner"><div class="da-card-title-row"><h3 class="da-card-title">Cost Using Straight PML - Interest Accruing</h3></div><div class="da-figure"><table class="da-table"><thead><tr><th>Line Item</th><th>Value</th></tr></thead><tbody>' + straightPmlRows.join('') + '</tbody></table></div></div></div>',
      '</div>',
      renderAnalysisWorkbookSection_(),
      '</div></div>'
    ].join('');
  }

  function renderAnalysisWorkbookSection_() {
    var exportState = state.exportWorkbook || {};
    var content = '';

    if (exportState.preparing) {
      content = [
        '<div class="da-export-status">',
        '<div class="da-cook-graphic" aria-hidden="true">',
        '<div class="da-cook-core"></div>',
        '<div class="da-cook-orbit da-cook-orbit-a"></div>',
        '<div class="da-cook-orbit da-cook-orbit-b"></div>',
        '<div class="da-cook-dot da-cook-dot-a"></div>',
        '<div class="da-cook-dot da-cook-dot-b"></div>',
        '<div class="da-cook-dot da-cook-dot-c"></div>',
        '</div>',
        '<div>',
        '<div class="da-export-title">Cooking up the analysis...</div>',
        '<div class="da-help">Gemini is drafting a short summary while Deal Cannon builds your downloadable Excel workbook.</div>',
        '</div>',
        '</div>'
      ].join('');
    } else if (exportState.downloadUrl) {
      content = [
        '<div class="da-export-status">',
        '<div>',
        '<div class="da-export-title">Workbook ready</div>',
        '<div class="da-help">Generated ' + escapeHtml(exportState.generatedAt || 'just now') + '.</div>',
        '</div>',
        '<a class="da-btn da-btn-primary" href="' + escapeHtml(exportState.downloadUrl) + '" download="' + escapeHtml(exportState.fileName || 'deal-cannon-analysis.xlsx') + '">Download Excel File</a>',
        '</div>'
      ].join('');
    } else if (exportState.error) {
      content = '<div class="da-error">' + escapeHtml(exportState.error) + '</div>';
    } else {
      content = '<div class="da-note">Run an analysis to automatically build a downloadable Excel breakdown.</div>';
    }

    return [
      '<div class="da-section-spacer da-card"><div class="da-card-inner da-stack">',
      '<div class="da-card-title-row"><h2 class="da-card-title">Downloadable Excel Breakdown</h2><span class="da-badge">Auto-built after Analyze</span></div>',
      content,
      '</div></div>'
    ].join('');
  }

  function renderUploadCard(title, description, uploadType) {
    var isComparables = uploadType === 'comparables';
    return [
      '<div class="da-upload"' + (uploadType ? ' data-upload-type="' + escapeHtml(uploadType) + '"' : '') + '>',
      '<div class="da-upload-icon">⇪</div>',
      '<h3 class="da-section-title">' + escapeHtml(title) + '</h3>',
      '<p class="da-muted">' + escapeHtml(description) + '</p>',
      isComparables ? '<ol class="da-step-list"><li>Go to Propwire.</li><li>Type in the property address.</li><li>Open the Comparables tab.</li><li>Select all of the addresses.</li><li>Download the CSV.</li><li>Drag and drop it here.</li></ol>' : '',
      state.comparablesFileName ? '<p class="da-help">Current file: ' + escapeHtml(state.comparablesFileName) + '</p>' : '',
      '<label class="da-upload-label da-btn da-btn-primary">Choose CSV or Drop Here<input id="comparablesFile" type="file" accept=".csv" /></label>',
      '</div>'
    ].join('');
  }

  function renderOutputBox(isLoading, error, text, emptyMessage, shortBox) {
    if (isLoading) {
      return '<div class="da-output ' + (shortBox ? 'da-output-short' : '') + '"><div class="da-loading"><div class="da-spinner"></div><span>Working on the analysis...</span></div></div>';
    }

    if (error) {
      return '<div class="da-output ' + (shortBox ? 'da-output-short' : '') + '"><div class="da-error">' + escapeHtml(error) + '</div></div>';
    }

    if (text) {
      return '<div class="da-output ' + (shortBox ? 'da-output-short' : '') + '"><pre class="da-pre">' + escapeHtml(text) + '</pre></div>';
    }

    return '<div class="da-output ' + (shortBox ? 'da-output-short' : '') + '"><div class="da-loading"><span>' + escapeHtml(emptyMessage) + '</span></div></div>';
  }

  function renderSelect(id, options, selectedValue) {
    return '<select class="da-select" data-model="form" id="' + id + '">' + options.map(function (option) { return '<option ' + (option === selectedValue ? 'selected' : '') + '>' + escapeHtml(option) + '</option>'; }).join('') + '</select>';
  }

  function renderField(id, label, value, type, inputClassName) {
    return '<div><label class="da-label" for="' + id + '">' + escapeHtml(label) + '</label><input class="da-input' + escapeHtml(inputClassName || '') + '" data-model="form" id="' + id + '" type="' + (type || 'text') + '" value="' + escapeHtml(value) + '" /></div>';
  }

  function renderReadonlyField(id, label, value, inputClassName) {
    return '<div><label class="da-label" for="' + id + '">' + escapeHtml(label) + '</label><input class="da-input da-input-readonly' + escapeHtml(inputClassName || '') + '" id="' + id + '" type="text" value="' + escapeHtml(value) + '" readonly /></div>';
  }

  function renderOperatingExpenseCalculatorCallout_(scope) {
    return [
      '<div class="da-calc-callout">',
      '<div class="da-calc-callout-copy">',
      '<div class="da-calc-callout-title">Click the Calculate button to calculate all the operating expenses for the formulas I just gave you</div>',
      '</div>',
      '<button class="da-btn da-btn-green" data-action="calculate-operating-expenses" data-calc-scope="' + escapeHtml(scope) + '">Calculate</button>',
      '</div>'
    ].join('');
  }

  function renderMortgageField(id, label, value, type) {
    return '<div><label class="da-label" for="' + id + '">' + escapeHtml(label) + '</label><input class="da-input" data-model="mortgage" id="' + id + '" type="' + (type || 'text') + '" value="' + escapeHtml(value) + '" /></div>';
  }

  function renderMortgageSelect(id, label, options, selectedValue) {
    return '<div><label class="da-label" for="' + id + '">' + escapeHtml(label) + '</label><select class="da-select" data-model="mortgage" id="' + id + '">' + options.map(function (option) { var normalized = typeof option === 'string' ? { value: option, label: option } : option; return '<option value="' + escapeHtml(normalized.value) + '" ' + (String(normalized.value) === String(selectedValue) ? 'selected' : '') + '>' + escapeHtml(normalized.label) + '</option>'; }).join('') + '</select></div>';
  }

  function buildMonthOptions() {
    return Array.from({ length: 12 }, function (_, index) {
      return { value: String(index + 1), label: new Date(0, index).toLocaleString('default', { month: 'short' }) };
    });
  }

  function buildYearOptions() {
    var year = new Date().getFullYear();
    return Array.from({ length: 10 }, function (_, index) {
      return { value: String(year + index), label: String(year + index) };
    });
  }

  function renderToggleGroup(label, name, options, selectedValue) {
    return [
      '<div>',
      '<label class="da-label">' + escapeHtml(label) + '</label>',
      '<div class="da-toggle-grid">',
      options.map(function (option) {
        var active = option.value === selectedValue;
        return '<button type="button" class="da-toggle ' + (active ? 'da-toggle-active' : '') + '" data-action="toggle" data-name="' + escapeHtml(name) + '" data-value="' + escapeHtml(option.value) + '">' + escapeHtml(option.label) + '</button>';
      }).join(''),
      '</div>',
      '</div>'
    ].join('');
  }

  function renderSummaryRow(label, value) {
    return '<div class="da-summary-row"><span>' + escapeHtml(label) + '</span><span>' + escapeHtml(value) + '</span></div>';
  }

  function renderResultRow(label, value, rowClass) {
    return '<tr class="' + (rowClass || '') + '"><td>' + escapeHtml(label) + '</td><td>' + escapeHtml(String(value)) + '</td></tr>';
  }
})();
</script>
